<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Orange sun radial gradient matching the Canva logo -->
    <radialGradient id="sunGrad" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#ff8a3c"/>
      <stop offset="55%" stop-color="#e85d1f"/>
      <stop offset="100%" stop-color="#a8330d"/>
    </radialGradient>
    <!-- Subtle outer glow -->
    <radialGradient id="bgGlow" cx="50%" cy="58%" r="55%">
      <stop offset="0%" stop-color="#ff6d00" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#ff6d00" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Clip the skyline to inside the sun -->
    <clipPath id="sunClip">
      <ellipse cx="256" cy="290" rx="170" ry="135"/>
    </clipPath>
  </defs>

  <!-- AMOLED black background -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- Background atmospheric glow -->
  <ellipse cx="256" cy="290" rx="240" ry="200" fill="url(#bgGlow)"/>

  <!-- The sun: an ellipse cropped at the bottom by the rect below it -->
  <ellipse cx="256" cy="290" rx="170" ry="135" fill="url(#sunGrad)"/>

  <!-- Black "horizon" cap to cleanly cut the sun's bottom -->
  <rect x="0" y="392" width="512" height="120" fill="#000000"/>

  <!-- Skyline silhouette, clipped inside the sun -->
  <g clip-path="url(#sunClip)">
    <!-- Buildings drawn as a single jagged polygon, traced from the source image.
         Origin: x=86 maps to building x=0 in source, sun_center y_baseline ~390.
         Source mark was 163px wide, mapped to 340px wide in this canvas (scale ~2.08).
         Heights from earlier trace (in source 107px tall, sun was at y=403-510):
         translating so that buildings sit on a baseline at y=390 in this 512 canvas. -->
    <path d="
      M 86 390
      L 86 320
      L 96 320
      L 96 305
      L 110 305
      L 110 333
      L 130 333
      L 130 282
      L 140 282
      L 140 270
      L 152 270
      L 152 296
      L 170 296
      L 170 277
      L 184 277
      L 184 305
      L 200 305
      L 200 320
      L 218 320
      L 218 252
      L 232 252
      L 232 240
      L 252 240
      L 252 285
      L 268 285
      L 268 250
      L 286 250
      L 286 305
      L 302 305
      L 302 318
      L 322 318
      L 322 252
      L 340 252
      L 340 280
      L 358 280
      L 358 240
      L 376 240
      L 376 282
      L 396 282
      L 396 232
      L 416 232
      L 416 252
      L 426 252
      L 426 390
      Z"
      fill="#000000"/>
  </g>

  <!-- Tiny lit windows on the buildings for life -->
  <g fill="#ffd54f" opacity="0.85">
    <rect x="120" y="316" width="2" height="3"/>
    <rect x="142" y="290" width="2" height="3"/>
    <rect x="178" y="288" width="2" height="3"/>
    <rect x="225" y="265" width="2" height="3"/>
    <rect x="248" y="252" width="2" height="3"/>
    <rect x="294" y="262" width="2" height="3"/>
    <rect x="328" y="265" width="2" height="3"/>
    <rect x="365" y="255" width="2" height="3"/>
    <rect x="402" y="248" width="2" height="3"/>
    <rect x="345" y="290" width="2" height="3"/>
    <rect x="183" y="312" width="2" height="3"/>
    <rect x="262" y="298" width="2" height="3"/>
  </g>
</svg>
