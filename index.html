    // ============================================================
    // Toasts component
    // ============================================================
    function ToastStack({ toasts }) {
      return e('div', { className: 'toast-stack' },
        toasts.map(t => e('div', { key: t.id, className: 'toast ' + (t.kind || 'amber') }, t.msg))
      );
    }

    // ============================================================
    // App Root
    // ============================================================
    function App() {
      const layout = useLayout();
      const game = useGameState();
      const { toasts, push: pushToast } = useToasts();
      const [tab, setTab] = useState('home');
      const [subscreen, setSubscreen] = useState(null); // for screens reached via "More"

      // ---- Firebase auth + cloud sync state ----
      const [currentUser, setCurrentUser] = useState(null);
      const [authReady, setAuthReady] = useState(false);
      const [syncStatus, setSyncStatus] = useState('idle'); // idle | syncing | synced | error
      const [conflict, setConflict] = useState(null); // { localState, cloudState, cloudMeta }
      const [showEnding, setShowEnding] = useState(false); // graduation ending overlay
      const [pendingFriendCode, setPendingFriendCode] = useState(null); // from ?friend=CODE
      const cloudSyncTimerRef = useRef(null);
      const lastPushedAtRef = useRef(0);

      // Subscribe to auth changes
      useEffect(() => {
        // First, handle redirect result (Google sign-in on Capacitor returns via redirect)
        HustleFire.checkRedirectResult().then(() => {
          // ignore — auth listener picks up the user
        });
        const unsub = HustleFire.onAuthChange((user) => {
          setCurrentUser(user);
          setAuthReady(true);
        });
        return unsub;
      }, []);

      // Parse invite link on initial load
      useEffect(() => {
        try {
          const params = new URLSearchParams(window.location.search);
          const code = params.get('friend');
          if (code) {
            setPendingFriendCode(code.toUpperCase());
            // Clean URL so refresh doesn't re-trigger
            const url = new URL(window.location);
            url.searchParams.delete('friend');
            window.history.replaceState({}, '', url.toString());
          }
        } catch (e) { /* ignore */ }
      }, []);

      // On sign-in: pull cloud save, register profile + friend code, possibly conflict-resolve
      useEffect(() => {
        if (!currentUser || !HustleFire.ready()) return;

        let cancelled = false;

        (async () => {
          try {
            // Read cloud save metadata to compare with local
            const meta = await HustleFire.getSaveMeta(currentUser.uid);
            const localHasProgress = (game.state.totalEarned || 0) > 0 || (game.state.customersServed || 0) > 0;

            if (cancelled) return;

            if (meta && (meta.totalEarned > 0 || meta.stacks > 0)) {
              // Cloud save exists with content
              if (localHasProgress &&
                  Math.abs((meta.totalEarned || 0) - (game.state.totalEarned || 0)) > 1) {
                // Both have progress AND they differ → ask the user
                const cloudState = await HustleFire.pullSave(currentUser.uid);
                if (!cancelled) {
                  setConflict({
                    cloudState: cloudState,
                    cloudMeta: meta,
                    localStacks: Math.floor(game.state.stacks || 0),
                    localEarned: Math.floor(game.state.totalEarned || 0)
                  });
                }
                return;
              } else if (!localHasProgress) {
                // Local is fresh, cloud has data → pull cloud
                const cloudState = await HustleFire.pullSave(currentUser.uid);
                if (cloudState && !cancelled) {
                  game.setState(cloudState);
                  pushToast('Cloud save restored.', 'good');
                }
                return;
              }
            }

            // No cloud save (or matches local) → push local up
            await HustleFire.pushSave(currentUser.uid, game.state, VERSION);
            await HustleFire.upsertUserProfile(currentUser.uid, {
              friendCode: game.state.account.friendCode,
              displayName: currentUser.displayName || 'Marcus',
              rank: getRank(game.state.totalEarned).name,
              stacks: game.state.stacks,
              totalEarned: game.state.totalEarned,
              reputation: game.state.reputation,
              customersServed: game.state.customersServed
            });
            await HustleFire.registerFriendCode(
              currentUser.uid,
              game.state.account.friendCode,
              currentUser.displayName || 'Marcus'
            );
          } catch (e) {
            console.warn('[sync] sign-in flow failed', e);
          }
        })();

        return () => { cancelled = true; };
      }, [currentUser ? currentUser.uid : null]);

      // Debounced cloud-push on any state change while signed in
      useEffect(() => {
        if (!currentUser || !HustleFire.ready() || conflict) return;
        if (cloudSyncTimerRef.current) clearTimeout(cloudSyncTimerRef.current);
        cloudSyncTimerRef.current = setTimeout(async () => {
          try {
            setSyncStatus('syncing');
            await HustleFire.pushSave(currentUser.uid, game.state, VERSION);
            await HustleFire.upsertUserProfile(currentUser.uid, {
              friendCode: game.state.account.friendCode,
              displayName: currentUser.displayName || 'Marcus',
              rank: getRank(game.state.totalEarned).name,
              stacks: game.state.stacks,
              totalEarned: game.state.totalEarned,
              reputation: game.state.reputation,
              customersServed: game.state.customersServed
            });
            lastPushedAtRef.current = Date.now();
            setSyncStatus('synced');
          } catch (e) {
            setSyncStatus('error');
          }
        }, 6000); // 6s debounce
        return () => { if (cloudSyncTimerRef.current) clearTimeout(cloudSyncTimerRef.current); };
      }, [game.state, currentUser, conflict]);

      const resolveConflict = async (choice) => {
        if (!conflict || !currentUser) { setConflict(null); return; }
        if (choice === 'cloud') {
          game.setState(conflict.cloudState);
          pushToast('Cloud save loaded.', 'good');
        } else if (choice === 'local') {
          await HustleFire.pushSave(currentUser.uid, game.state, VERSION);
          pushToast('Local save kept and pushed to cloud.', 'good');
        }
        setConflict(null);
      };

      // ---- Graduation ending: fires ONCE when totalEarned crosses Owner threshold ----
      useEffect(() => {
        const OWNER_THRESHOLD = 1000000;
        const acc = game.state.account || {};
        if ((game.state.totalEarned || 0) >= OWNER_THRESHOLD && !acc.graduated && !showEnding) {
          setShowEnding(true);
        }
      }, [game.state.totalEarned, game.state.account ? game.state.account.graduated : null]);

      const dismissEnding = () => {
        const today = new Date();
        const nextJob = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000);
        game.updateAccount({
          graduated: true,
          graduatedAt: today.toISOString(),
          nextJobDate: nextJob.toISOString()
        });
        setShowEnding(false);
      };

      // ---- Achievement unlock toasts ----
      // First render: mark all currently-unlocked as already-seen so we don't toast on load.
      const seenAchievementsRef = useRef(null);
      useEffect(() => {
        const unlocked = Array.isArray(game.state.unlockedAchievements) ? game.state.unlockedAchievements : [];
        if (seenAchievementsRef.current === null) {
          // Initial mount — seed the set without toasting.
          seenAchievementsRef.current = new Set(unlocked);
          return;
        }
        const seen = seenAchievementsRef.current;
        for (let i = 0; i < unlocked.length; i++) {
          const id = unlocked[i];
          if (seen.has(id)) continue;
          seen.add(id);
          const ach = ACHIEVEMENTS.find(a => a.id === id);
          if (ach) pushToast('🏆 ' + ach.title + ' unlocked!', 'good');
        }
      }, [game.state.unlockedAchievements]);

      const goTo = (target) => {
        // Map convenience targets to tabs/subscreens
        if (target === 'work')   { setTab('work');   setSubscreen(null); return; }
        if (target === 'arcade') { setTab('arcade'); setSubscreen(null); return; }
        if (target === 'home')   { setTab('home');   setSubscreen(null); return; }
        if (target === 'friends'){ setTab('friends');setSubscreen(null); return; }
        // Subscreens (reached via More)
        if (['settings', 'news', 'achievements', 'profile'].includes(target)) {
          setTab('more');
          setSubscreen(target);
          return;
        }
        setTab(target);
        setSubscreen(null);
      };

      const renderActive = () => {
        if (tab === 'more' && subscreen) {
          const backToMore = () => setSubscreen(null);
          if (subscreen === 'settings')     return e(SettingsScreen,     { state: game.state, updateSettings: game.updateSettings, onGoTo: goTo, onBack: backToMore, currentUser, authReady, syncStatus, toast: pushToast });
          if (subscreen === 'news')         return e(NewsScreen,         { markRead: game.markNewsRead, onBack: backToMore });
          if (subscreen === 'achievements') return e(AchievementsScreen, { onBack: backToMore, state: game.state });
          if (subscreen === 'profile')      return e(ProfileScreen,      { state: game.state, onBack: backToMore });
        }
        if (tab === 'home')    return e(HomeScreen,     { state: game.state, onGoTo: goTo });
        if (tab === 'work')    return e(FoodTruckScreen,{ state: game.state, addStacks: game.addStacks, addReputation: game.addReputation, recordOrder: game.recordOrder, logEvent: game.logEvent, completeJob: game.completeJob, toast: pushToast });
        if (tab === 'arcade')  return e(BackRoomScreen, { state: game.state, addStacks: game.addStacks, toast: pushToast, unlockAchievement: game.unlockAchievement });
        if (tab === 'friends') return e(FriendsScreen,  { state: game.state, currentUser, onGoTo: goTo, pendingFriendCode, clearPendingFriendCode: () => setPendingFriendCode(null), toast: pushToast, unlockAchievement: game.unlockAchievement });
        if (tab === 'more')    return e(MoreScreen,     { onGoTo: goTo, state: game.state });
        return null;
      };

      return e('div', { style: { minHeight: '100vh' } },
        // Sidebar (desktop) or none
        !layout.isMobile ? e(Sidebar, { tab, onChange: (t) => { setTab(t); setSubscreen(null); } }) : null,
        // Top bar (always visible)
        e('div', { style: { marginLeft: !layout.isMobile ? 220 : 0 } },
          e(TopBar, { state: game.state, layout, onProfileClick: () => goTo('profile') })
        ),
        // Main content
        e('div', { style: { marginLeft: !layout.isMobile ? 220 : 0 } },
          renderActive()
        ),
        // Bottom nav (mobile)
        layout.isMobile ? e(BottomNav, { tab, onChange: (t) => { setTab(t); setSubscreen(null); } }) : null,
        // Toasts
        e(ToastStack, { toasts }),
        // Graduation ending overlay (fires once when crossing Owner threshold)
        showEnding ? e(EndingSequence, { onDismiss: dismissEnding }) : null,
        // Conflict resolution dialog (cloud vs local)
        conflict ? e('div', { className: 'shift-end-overlay' },
          e('div', { className: 'shift-end-card', style: { maxWidth: 440 } },
            e('div', { className: 'shift-end-night' }, '☁️'),
            e('h2', { className: 'shift-end-title display-font' }, 'Save Conflict'),
            e('div', { className: 'shift-end-quote' },
              "We found a cloud save AND a local save on this device. Pick which one to keep — the other will be overwritten."
            ),
            e('div', { style: { display: 'flex', gap: 10, marginBottom: 14 } },
              e('div', { className: 'shift-summary-cell', style: { flex: 1 } },
                e('div', { className: 'ssc-label' }, 'Cloud'),
                e('div', { className: 'ssc-value' }, fmtStacks(conflict.cloudMeta.stacks || 0))
              ),
              e('div', { className: 'shift-summary-cell', style: { flex: 1 } },
                e('div', { className: 'ssc-label' }, 'Local'),
                e('div', { className: 'ssc-value' }, fmtStacks(conflict.localStacks))
              )
            ),
            e('button', {
              className: 'btn btn-primary',
              style: { width: '100%', marginBottom: 8 },
              onClick: () => resolveConflict('cloud')
            }, 'Use Cloud Save'),
            e('button', {
              className: 'btn btn-ghost',
              style: { width: '100%' },
              onClick: () => resolveConflict('local')
            }, 'Keep Local & Overwrite Cloud')
          )
        ) : null
      );
    }

    // ============================================================
    // Mount
    // ============================================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  })();
  </script>

  <script>
  // ============================================================
  // Service worker registration + cache-clear-on-update
  // ============================================================
  (function () {
    if (!('serviceWorker' in navigator)) return;
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        // Force-check for new version on load
        reg.update();

        // When a new SW takes control, reload to load fresh assets
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      }).catch(function (err) {
        console.warn('SW register failed', err);
      });
    });

    // Version-based hard-refresh check (fetches version.txt and compares)
    fetch('version.txt?cb=' + Date.now())
      .then(function (r) { return r.text(); })
      .then(function (txt) {
        const remote = (txt || '').trim();
        const localKey = 'hustlebox_version_seen';
        const seen = localStorage.getItem(localKey);
        if (seen && seen !== remote) {
          // Clear all caches and force reload
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }).then(function () {
              localStorage.setItem(localKey, remote);
              window.location.reload();
            });
          } else {
            localStorage.setItem(localKey, remote);
            window.location.reload();
          }
        } else {
          localStorage.setItem(localKey, remote);
        }
      })
      .catch(function () { /* ignore */ });
  })();
  </script>
