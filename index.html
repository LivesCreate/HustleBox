    // ============================================================
    // Food Truck Mini-Game
    // ============================================================
    function FoodTruckScreen({ state, addStacks, addReputation, recordOrder, logEvent, completeJob, toast }) {
      const tier = getRepTier(state.reputation);

      const [order, setOrder] = useState(null);          // current order: array of emojis (with possible repeats)
      const [plate, setPlate] = useState([]);            // current plate contents
      const [timeLeft, setTimeLeft] = useState(0);
      const [maxTime, setMaxTime] = useState(0);
      const [result, setResult] = useState(null);
      const [event, setEvent] = useState(null);
      const [activeBuffs, setActiveBuffs] = useState({});
      const [customerFace, setCustomerFace] = useState('😀');
      const [shiftActive, setShiftActive] = useState(false);
      const [shiftEndSummary, setShiftEndSummary] = useState(null);
      const [shiftStartSnapshot, setShiftStartSnapshot] = useState(null);
      const [draggingItem, setDraggingItem] = useState(null);
      const [dragPos, setDragPos] = useState({ x: 0, y: 0 });
      const [overPlate, setOverPlate] = useState(false);

      const orderTimerRef = useRef(null);
      const plateRef = useRef(null);
      const nextCustomerTimeoutRef = useRef(null);

      // Item lookup helper
      const itemByEmoji = (emoji) => MENU_ITEMS.find(m => m.emoji === emoji);

      const generateOrder = () => {
        const len = 2 + Math.floor(Math.random() * 3); // 2-4 items
        const o = [];
        for (let i = 0; i < len; i++) o.push(INGREDIENTS[Math.floor(Math.random() * INGREDIENTS.length)]);
        return o;
      };

      const startNewCustomer = useCallback(() => {
        if (!event && Math.random() < 0.15) {
          const eligible = EVENTS.filter(ev =>
            (ev.jobs.includes('food_truck') || ev.jobs.includes('*')) &&
            !state.eventLog.slice(-3).includes(ev.id)
          );
          if (eligible.length) {
            const picked = eligible[Math.floor(Math.random() * eligible.length)];
            setEvent(picked);
            // BUG FIX: track event firing in eventLog so it doesn't repeat back-to-back
            logEvent(picked.id);
            return;
          }
        }

        const newOrder = generateOrder();
        // More time per item since now you have to assemble (not just tap)
        const baseTime = 12 + (newOrder.length - 2) * 3;
        const time = baseTime + (activeBuffs.timerPenalty || 0);
        setOrder(newOrder);
        setPlate([]);
        setTimeLeft(time);
        setMaxTime(time);
        setCustomerFace(CUSTOMER_FACES[Math.floor(Math.random() * CUSTOMER_FACES.length)]);
        setResult(null);
      }, [event, activeBuffs, state.eventLog]);

      const startShift = () => {
        setShiftStartSnapshot({
          customers: state.customersServed,
          earned: state.totalEarned,
          rep: state.reputation
        });
        setShiftActive(true);
        startNewCustomer();
      };

      const endShift = () => {
        setShiftActive(false);
        setOrder(null);
        setPlate([]);
        setResult(null);
        setEvent(null);
        if (orderTimerRef.current) clearInterval(orderTimerRef.current);
        // BUG FIX: clear dangling next-customer timeout so endShift is final
        if (nextCustomerTimeoutRef.current) {
          clearTimeout(nextCustomerTimeoutRef.current);
          nextCustomerTimeoutRef.current = null;
        }
        // BUG FIX: increment jobsCompleted so the DAY N counter advances
        completeJob();
        if (shiftStartSnapshot) {
          const served = state.customersServed - shiftStartSnapshot.customers;
          const earned = Math.floor(state.totalEarned - shiftStartSnapshot.earned);
          const repDelta = Math.round(state.reputation - shiftStartSnapshot.rep);
          setShiftEndSummary({ served, earned, repDelta });
        } else {
          setShiftEndSummary({ served: 0, earned: 0, repDelta: 0 });
        }
      };

      const dismissShiftEnd = () => setShiftEndSummary(null);

      useEffect(() => {
        document.body.classList.toggle('scroll-locked', shiftActive && !!order);
        return () => document.body.classList.remove('scroll-locked');
      }, [shiftActive, order]);

      useEffect(() => {
        if (!order || result) return;
        orderTimerRef.current = setInterval(() => {
          setTimeLeft(t => {
            if (t <= 0.1) {
              clearInterval(orderTimerRef.current);
              return 0;
            }
            return t - 0.1;
          });
        }, 100);
        return () => clearInterval(orderTimerRef.current);
      }, [order, result]);

      useEffect(() => {
        if (order && timeLeft <= 0 && !result) {
          finishOrder('failed');
        }
      }, [timeLeft, order, result]);

      const finishOrder = (resultKey) => {
        const r = RESULT_TYPES[resultKey];
        const tipMult = (activeBuffs.tipMult || 1) * tier.tip;
        const stacksEarned = Math.floor(r.baseStacks * tipMult);
        if (stacksEarned !== 0) addStacks(stacksEarned);
        if (r.repDelta !== 0) addReputation(r.repDelta);
        recordOrder(resultKey);
        setResult({ key: resultKey, stacks: stacksEarned });
        vibrate(state, resultKey === 'perfect' ? [40, 40, 80] : resultKey === 'failed' ? [200] : [60]);
        // BUG FIX: clear any prior queued next-customer call before scheduling a new one
        if (nextCustomerTimeoutRef.current) clearTimeout(nextCustomerTimeoutRef.current);
        nextCustomerTimeoutRef.current = setTimeout(() => {
          nextCustomerTimeoutRef.current = null;
          if (shiftActive) startNewCustomer();
        }, 1800);
      };

      // ============= ORDER MATCHING =============
      // Compare plate contents (multiset) to order requirements (multiset)
      const matchOrder = (plateArr, orderArr) => {
        const orderCount = {};
        const plateCount = {};
        for (const o of orderArr) orderCount[o] = (orderCount[o] || 0) + 1;
        for (const p of plateArr) plateCount[p] = (plateCount[p] || 0) + 1;
        let missing = 0, extra = 0;
        const allKeys = new Set([...Object.keys(orderCount), ...Object.keys(plateCount)]);
        for (const k of allKeys) {
          const need = orderCount[k] || 0;
          const have = plateCount[k] || 0;
          if (have < need) missing += (need - have);
          else if (have > need) extra += (have - need);
        }
        return { exact: missing === 0 && extra === 0, missing, extra };
      };

      const handleServe = () => {
        if (!order || result || plate.length === 0) return;
        const match = matchOrder(plate, order);
        const fractionLeft = timeLeft / maxTime;
        let resultKey;
        if (match.exact && fractionLeft >= 0.5) resultKey = 'perfect';
        else if (match.exact && fractionLeft >= 0.25) resultKey = 'good';
        else if (match.exact) resultKey = 'okay';
        else if ((match.missing + match.extra) <= 1) resultKey = 'bad';
        else resultKey = 'failed';
        finishOrder(resultKey);
      };

      // Plate item removal — tap to remove (in case of mistake)
      const removeFromPlate = (idx) => {
        if (result) return;
        setPlate(p => p.filter((_, i) => i !== idx));
      };

      // ============= DRAG-AND-DROP =============
      const handleStartDrag = (item, e) => {
        if (result || !order) return;
        e.preventDefault();
        const point = e.touches && e.touches[0] ? e.touches[0] : e;
        setDraggingItem(item);
        setDragPos({ x: point.clientX, y: point.clientY });
      };

      // Global pointer tracking while dragging
      useEffect(() => {
        if (!draggingItem) return;

        const move = (ev) => {
          const point = ev.touches && ev.touches[0] ? ev.touches[0] : ev;
          const x = point.clientX, y = point.clientY;
          if (x !== undefined && y !== undefined) {
            setDragPos({ x, y });
            const rect = plateRef.current && plateRef.current.getBoundingClientRect();
            if (rect) {
              setOverPlate(x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom);
            }
          }
        };

        const up = (ev) => {
          const point = ev.changedTouches && ev.changedTouches[0]
            ? ev.changedTouches[0]
            : ev;
          const x = point.clientX, y = point.clientY;
          const rect = plateRef.current && plateRef.current.getBoundingClientRect();
          if (rect && x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
            setPlate(p => [...p, draggingItem]);
            vibrate(state, [30]);
          }
          setDraggingItem(null);
          setOverPlate(false);
        };

        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
        window.addEventListener('pointercancel', up);
        return () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          window.removeEventListener('pointercancel', up);
        };
      }, [draggingItem]);

      const resolveEvent = (option) => {
        if (!event) return;
        const effect = option ? option.effect : (event.effect || {});
        let summary = '';
        if (effect.stacks) {
          addStacks(effect.stacks);
          summary += (effect.stacks > 0 ? '+' : '') + effect.stacks + ' Stacks. ';
        }
        if (effect.rep) {
          addReputation(effect.rep);
          summary += (effect.rep > 0 ? '+' : '') + effect.rep + ' rep. ';
        }
        if (effect.tipMult || effect.customerMult || effect.timerPenalty) {
          setActiveBuffs(b => ({ ...b, ...effect }));
          if (effect.durationMs) {
            setTimeout(() => {
              setActiveBuffs(b => {
                const copy = { ...b };
                if (effect.tipMult) delete copy.tipMult;
                if (effect.customerMult) delete copy.customerMult;
                if (effect.timerPenalty) delete copy.timerPenalty;
                return copy;
              });
            }, effect.durationMs);
          }
        }
        toast(event.title + (summary ? ' — ' + summary : ''), 'amber');
        setEvent(null);
        setTimeout(() => startNewCustomer(), 400);
      };

      // End-of-shift overlay (shown after endShift while summary is set)
      const endOverlay = shiftEndSummary
        ? e(EndOfShiftSequence, {
            summary: shiftEndSummary,
            soundOn: !!state.settings.sound,
            onDismiss: dismissShiftEnd
          })
        : null;

      // Pre-shift screen — theatrical opening + chalkboard menu
      if (!shiftActive) {
        const dayNum = Math.floor(state.jobsCompleted) + 1;
        return e('div', { className: 'main has-bottomnav' },
          e('div', { className: 'screen-header' },
            e('h1', { className: 'screen-title display-font' }, "Ray's Food Truck"),
            e('p', { className: 'screen-subtitle' }, '5th and Main • Open from dawn till you call it')
          ),

          // Theatrical intro card
          e('div', { className: 'shift-intro' },
            e('div', { className: 'shift-intro-day' }, 'DAY ' + dayNum + ' · 5TH AND MAIN'),
            e('h2', { className: 'shift-intro-title' }, "Ray's"),
            e('button', {
              className: 'open-sign',
              onClick: startShift,
              title: 'Click to open shift'
            }, 'OPEN'),
            e('div', { className: 'ray-quote' },
              e('strong', null, 'Ray: '),
              state.reputation >= 60
                ? '"Crew\'s lookin\' good. Don\'t get cocky."'
                : state.reputation < 30
                  ? '"You\'re draggin\' my name through the mud. Fix it."'
                  : '"Don\'t burn nothin\'. People talkin\' already."'
            )
          ),

          // Menu board with prices
          e('div', { className: 'menu-board' },
            e('div', { className: 'menu-title' }, "TODAY'S MENU"),
            MENU_ITEMS.map(item =>
              e('div', { className: 'menu-row', key: item.emoji },
                e('span', { className: 'menu-emoji' }, item.emoji),
                e('span', { className: 'menu-name' }, item.name),
                e('span', { className: 'menu-dots' }),
                e('span', { className: 'menu-price' }, '$' + item.price)
              )
            )
          ),

          // Tip / flow info
          e('div', { className: 'card', style: { marginBottom: 16 } },
            e('div', { style: { display: 'flex', justifyContent: 'space-between' } },
              e('div', null,
                e('div', { style: { fontSize: 11, color: 'var(--text-faint)' } }, 'Customer flow'),
                e('div', { style: { fontSize: 16, fontWeight: 700 } }, Math.round(tier.flow * 100) + '%')
              ),
              e('div', null,
                e('div', { style: { fontSize: 11, color: 'var(--text-faint)' } }, 'Tip multiplier'),
                e('div', { style: { fontSize: 16, fontWeight: 700 } }, '×' + tier.tip.toFixed(2))
              ),
              e('div', null,
                e('div', { style: { fontSize: 11, color: 'var(--text-faint)' } }, 'Reputation'),
                e('div', { style: { fontSize: 16, fontWeight: 700, color: 'var(--amber)' } }, tier.name)
              )
            )
          ),

          e('button', {
            className: 'btn btn-primary',
            style: { width: '100%', fontSize: 16, padding: '14px 18px' },
            onClick: startShift
          }, '🚚 Open the Window'),

          endOverlay
        );
      }

      // Compute order summary for the receipt
      const orderSummary = order ? (() => {
        const counts = {};
        for (const o of order) counts[o] = (counts[o] || 0) + 1;
        const lines = Object.entries(counts).map(([emoji, count]) => {
          const item = itemByEmoji(emoji);
          return { emoji, count, name: item ? item.name : '???', subtotal: count * (item ? item.price : 0) };
        });
        const total = lines.reduce((sum, l) => sum + l.subtotal, 0);
        return { lines, total };
      })() : null;

      // Active shift
      return e('div', { className: 'main has-bottomnav' },
        e('div', { className: 'screen-header', style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
          e('h1', { className: 'screen-title display-font', style: { fontSize: 24 } }, 'On Shift'),
          e('button', { className: 'btn btn-ghost', style: { padding: '8px 14px', fontSize: 13 }, onClick: endShift }, 'End Shift')
        ),

        // Random event card
        event ? e('div', { className: 'event-card', style: { marginBottom: 14 } },
          e('div', { className: 'event-title' }, '⚡ ' + event.title),
          e('div', { style: { fontSize: 14, color: 'var(--text-dim)', marginBottom: 12 } }, event.desc),
          event.options
            ? e('div', { style: { display: 'flex', gap: 8 } },
                event.options.map((opt, i) =>
                  e('button', {
                    key: i,
                    className: 'btn ' + (i === 0 ? 'btn-primary' : 'btn-ghost'),
                    style: { flex: 1 },
                    onClick: () => resolveEvent(opt)
                  }, opt.label)
                )
              )
            : e('button', {
                className: 'btn btn-primary',
                style: { width: '100%' },
                onClick: () => resolveEvent(null)
              }, 'OK')
        ) : null,

        // The food truck stage
        order && orderSummary ? e('div', { className: 'ft-stage' },
          // Customer + receipt ticket row
          e('div', { className: 'customer-row' },
            e('div', { className: 'customer-card' + (timeLeft / maxTime < 0.3 ? ' impatient' : '') },
              e('div', { className: 'face' }, customerFace),
              e('div', { className: 'patience-bar' },
                e('div', { className: 'patience-bar-fill', style: { width: (timeLeft / maxTime * 100) + '%' } })
              )
            ),
            e('div', { className: 'order-receipt' },
              e('div', { className: 'receipt-header' }, "★ RAY'S ★ ORDER ★"),
              e('div', { className: 'receipt-items' },
                orderSummary.lines.map((l, i) =>
                  e('div', { className: 'item-line', key: i },
                    e('span', null,
                      e('span', { className: 'item-emoji' }, l.emoji), ' × ', l.count, ' ', l.name
                    ),
                    e('span', null, '$' + l.subtotal)
                  )
                )
              ),
              e('div', { className: 'receipt-total' },
                e('span', null, 'TOTAL'),
                e('span', null, '$' + orderSummary.total)
              )
            )
          ),

          // Timer bar
          e('div', { className: 'timer-bar' },
            e('div', { className: 'timer-bar-fill', style: { width: (timeLeft / maxTime * 100) + '%' } })
          ),

          // Stainless counter line above plate (visual separator)
          e('div', { className: 'counter-line' }),

          // Build plate (the 3D perspective area)
          e('div', { className: 'prep-counter' },
            e('div', {
              ref: plateRef,
              className: 'build-plate' + (overPlate ? ' drag-over' : '')
            },
              plate.length === 0
                ? e('div', { className: 'build-plate-empty' }, 'DRAG TO PLATE')
                : e('div', { className: 'build-plate-items' },
                    plate.map((item, idx) =>
                      e('span', {
                        key: idx + '_' + item,
                        className: 'plate-item',
                        onClick: () => removeFromPlate(idx),
                        title: 'Tap to remove'
                      }, item)
                    )
                  )
            )
          ),

          // Ingredient tray (drag source)
          e('div', { className: 'ingredient-tray' },
            MENU_ITEMS.map(item =>
              e('div', {
                key: item.emoji,
                className: 'ingredient-card' + (draggingItem === item.emoji ? ' dragging' : ''),
                onPointerDown: (ev) => handleStartDrag(item.emoji, ev),
                onTouchStart: (ev) => handleStartDrag(item.emoji, ev)
              },
                e('div', { className: 'ic-emoji' }, item.emoji),
                e('div', { className: 'ic-price' }, '$' + item.price)
              )
            )
          ),

          // Serve button (lit up when plate has items)
          e('button', {
            className: 'serve-btn',
            disabled: plate.length === 0 || !!result,
            onClick: handleServe
          },
            e('span', { className: 'bell' }, '🔔 '), 'SERVE'
          ),

          // Result overlay
          result ? e('div', { className: 'result-overlay' },
            e('div', {
              className: 'result-label display-font' + (result.key === 'perfect' ? ' perfect' : ''),
              style: { color: RESULT_TYPES[result.key].color }
            }, RESULT_TYPES[result.key].label),
            e('div', { style: { fontSize: 36 } }, RESULT_TYPES[result.key].emoji),
            result.stacks > 0
              ? e('div', { className: 'result-stacks' }, '+' + result.stacks + ' Stacks')
              : e('div', { style: { color: 'var(--bad)', fontWeight: 700 } }, 'No tip.')
          ) : null
        ) : null,

        // Drag ghost (the floating element that follows the pointer)
        draggingItem ? e('div', {
          className: 'drag-ghost',
          style: { left: dragPos.x + 'px', top: dragPos.y + 'px' }
        }, draggingItem) : null,

        // Active buffs indicator
        Object.keys(activeBuffs).length > 0
          ? e('div', { style: { marginTop: 12, fontSize: 12, color: 'var(--amber)', textAlign: 'center' } },
              '⚡ Event active')
          : null
      );
    }

    // ============================================================
    // News / Update Log Screen
    // ============================================================
    function NewsScreen({ markRead, onBack }) {
      const [news, setNews] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        fetch('news.json?v=' + VERSION)
          .then(r => r.json())
          .then(data => { setNews(data); setLoading(false); markRead(VERSION); })
          .catch(() => { setLoading(false); });
      }, [markRead]);

      const renderEntry = (entry, isCurrent) =>
        e('div', { className: 'receipt-card', key: entry.version },
          e('div', { className: 'receipt-header-line' }, isCurrent ? "★ LATEST RELEASE ★" : "★ RAY'S RECEIPT ★"),
          e('div', { className: 'receipt-version' }, 'v' + entry.version),
          e('div', { className: 'receipt-title' }, entry.title || ''),
          e('ul', { className: 'receipt-list' },
            (entry.highlights || []).map((h, j) => e('li', { key: j }, h))
          ),
          entry.date ? e('div', { className: 'receipt-date' }, entry.date) : null
        );

      return e('div', { className: 'main has-bottomnav' },
        e('div', { className: 'screen-header' },
          onBack ? e('button', { className: 'back-btn', onClick: onBack },
            e('span', { className: 'arrow' }, '‹'), 'Back'
          ) : null,
          e('h1', { className: 'screen-title display-font' }, 'Update Log'),
          e('p', { className: 'screen-subtitle' }, "What's new on the block")
        ),
        loading
          ? e('div', { style: { color: 'var(--text-faint)', padding: 16 } }, 'Loading...')
          : news
            ? e('div', { className: 'side-menu-frame' },
                e('div', { className: 'smf-title' }, 'UPDATE LOG'),

    // ============================================================

      const { toasts, push: pushToast } = useToasts();
      const [tab, setTab] = useState('home');
      const [subscreen, setSubscreen] = useState(null); // for screens reached via "More"

      const goTo = (target) => {
        // Map convenience targets to tabs/subscreens
        if (target === 'work')   { setTab('work');   setSubscreen(null); return; }
        if (target === 'arcade') { setTab('arcade'); setSubscreen(null); return; }
        if (target === 'home')   { setTab('home');   setSubscreen(null); return; }
        if (target === 'friends'){ setTab('friends');setSubscreen(null); return; }
        // Subscreens (reached via More)
        if (['settings', 'news', 'achievements', 'profile'].includes(target)) {
          setTab('more');
          setSubscreen(target);
          return;
        }
        setTab(target);
        setSubscreen(null);
      };

      const renderActive = () => {
        if (tab === 'more' && subscreen) {
          const backToMore = () => setSubscreen(null);
          if (subscreen === 'settings')     return e(SettingsScreen,     { state: game.state, updateSettings: game.updateSettings, onGoTo: goTo, onBack: backToMore });
          if (subscreen === 'news')         return e(NewsScreen,         { markRead: game.markNewsRead, onBack: backToMore });
          if (subscreen === 'achievements') return e(AchievementsScreen, { onBack: backToMore });
          if (subscreen === 'profile')      return e(ProfileScreen,      { state: game.state, onBack: backToMore });
        }
        if (tab === 'home')    return e(HomeScreen,     { state: game.state, onGoTo: goTo });

        if (tab === 'arcade')  return e(ArcadeScreen,   null);
        if (tab === 'friends') return e(FriendsScreen,  { state: game.state });
        if (tab === 'more')    return e(MoreScreen,     { onGoTo: goTo, state: game.state });
        return null;
      };

      return e('div', { style: { minHeight: '100vh' } },
        // Sidebar (desktop) or none
        !layout.isMobile ? e(Sidebar, { tab, onChange: (t) => { setTab(t); setSubscreen(null); } }) : null,

        ),
        // Main content
        e('div', { style: { marginLeft: !layout.isMobile ? 220 : 0 } },
          renderActive()
        ),
        // Bottom nav (mobile)
        layout.isMobile ? e(BottomNav, { tab, onChange: (t) => { setTab(t); setSubscreen(null); } }) : null,
        // Toasts
        e(ToastStack, { toasts })
      );
    }

  <script>
  // ============================================================
  // Service worker registration + cache-clear-on-update
  // ============================================================
  (function () {
    if (!('serviceWorker' in navigator)) return;
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        // Force-check for new version on load
        reg.update();

        // When a new SW takes control, reload to load fresh assets
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      }).catch(function (err) {
        console.warn('SW register failed', err);
      });
    });

    // Version-based hard-refresh check (fetches version.txt and compares)
    fetch('version.txt?cb=' + Date.now())
      .then(function (r) { return r.text(); })
      .then(function (txt) {
        const remote = (txt || '').trim();
        const localKey = 'hustlebox_version_seen';
        const seen = localStorage.getItem(localKey);
        if (seen && seen !== remote) {
          // Clear all caches and force reload
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }).then(function () {
              localStorage.setItem(localKey, remote);
              window.location.reload();
            });
          } else {
            localStorage.setItem(localKey, remote);
            window.location.reload();
          }
        } else {
          localStorage.setItem(localKey, remote);
        }
      })
      .catch(function () { /* ignore */ });
  })();
  </script>
