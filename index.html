      .main { max-width: 980px; margin: 0 auto; padding-left: 32px; padding-right: 32px; }
      /* Side-menu chalkboard frames look better when contained */
      .side-menu-frame { max-width: 720px; margin-left: auto; margin-right: auto; }
      /* Profile hero — bigger avatar on desktop */
      .profile-hero { padding: 30px 24px; }
      .profile-avatar-frame { width: 110px !important; height: 110px !important; }
      .profile-name { font-size: 38px; }
      /* Resume sections: place stat grid in 3 columns on desktop */
      .resume-mini-grid { grid-template-columns: repeat(3, 1fr); }
      /* Settings rows look better with breathing room */
      .row { padding: 16px 18px; }
      /* Achievements: 2 columns on desktop instead of 1 */
      .ach-list { grid-template-columns: 1fr 1fr; gap: 10px; }
      /* Update Log: contain receipt-card width so they don't stretch */
      .receipt-card { max-width: 560px; margin-left: auto; margin-right: auto; }
      /* Back Room scene scales up nicely */
      .backroom-scene { max-width: 680px; margin: 12px auto 16px; max-height: 460px; }
      /* News header titles slightly larger on desktop */
      .screen-title { font-size: 36px; }
      .screen-subtitle { font-size: 14px; }
      /* Workplace card on Home — taller so the truck reads bigger */
      .home-workplace { max-width: 640px; margin-left: auto; margin-right: auto; }
      .home-workplace-scene { height: 150px; }
      /* Auth modal stays centered, no change needed */
    }
    @media (min-width: 1100px) {
      /* On wider screens, give the resume + stats a 2-col layout */
      .main { max-width: 1080px; }
    }
  </style>
</head>
<body>
  <div class="streetglow"></div>
  <div class="skyline" id="skyline"></div>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Firebase SDK (compat build for global access) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <!-- QR code generator for friend codes -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

  <script>
  (function () {
    'use strict';

    // ============================================================
    // VERSION — bump in ALL 4 locations every release
    // 1. const VERSION here
    // 2. version.txt
    // 3. sw.js CACHE_NAME
    // 4. news.json title + message
    // ============================================================
    const VERSION = '1.2.5';

    const e = React.createElement;
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ============================================================
    // CONSTANTS
    // ============================================================
    const STORAGE_KEY = 'hustlebox_save';
    const SETTINGS_KEY = 'hustlebox_settings';
    const NEWS_READ_KEY = 'hustlebox_news_read';
    const IDLE_CAP_HOURS = 8;
    const TICK_MS = 1000;

    const RANKS = [
      { id: 'dishwasher', name: 'Dishwasher', threshold: 0,        wagePerSec: 0.5  },
      { id: 'prep_cook',  name: 'Prep Cook',  threshold: 100,      wagePerSec: 0.75 },
      { id: 'line_cook',  name: 'Line Cook',  threshold: 1000,     wagePerSec: 1.0  },
      { id: 'head_cook',  name: 'Head Cook',  threshold: 10000,    wagePerSec: 1.75 },
      { id: 'manager',    name: 'Manager',    threshold: 100000,   wagePerSec: 3.0  },
      { id: 'owner',      name: 'Owner',      threshold: 1000000,  wagePerSec: 5.0  }
    ];

    const REP_TIERS = [
      { min: 80, max: 100, name: 'Beloved',     desc: 'Max customer flow, bonus tips, VIP customers appear', flow: 1.5,  tip: 1.5  },
      { min: 60, max: 79,  name: 'Respected',   desc: 'Normal customer flow, standard tips',                  flow: 1.0,  tip: 1.0  },
      { min: 40, max: 59,  name: 'Known',       desc: 'Slightly reduced flow, smaller tips',                  flow: 0.85, tip: 0.85 },
      { min: 20, max: 39,  name: 'Doubted',     desc: 'Noticeably fewer customers, Ray gives warnings',       flow: 0.6,  tip: 0.7  },
      { min: 0,  max: 19,  name: 'Blacklisted', desc: 'Minimal customers, certain jobs locked',               flow: 0.35, tip: 0.5  }
    ];

    // ============================================================
    // ACHIEVEMENTS — checked against state on every change.
    // .check(state) returns true when the achievement is earned.
    // .secret = true hides the description until unlocked.
    // ============================================================
    const ACHIEVEMENTS = [
      // ---- Work ----

        if (!raw) return null;
        return JSON.parse(raw);
      } catch (err) {
        console.error('loadSave failed', err);
        return null;
      }
    }
    function saveSave(state) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.error('saveSave failed', err);
      }
    }

      return out;

      // Hydrate any new fields added since the user's saved version
      const def = defaultState();
      const merged = { ...def, ...saved };
      merged.settings = { ...def.settings, ...(saved.settings || {}) };
      merged.account = { ...def.account, ...(saved.account || {}) };
      merged.friends = Array.isArray(saved.friends) ? saved.friends : [];
      merged.rivals = Array.isArray(saved.rivals) ? saved.rivals : [];
      merged.achievements = saved.achievements || {};
      merged.unlockedAchievements = Array.isArray(saved.unlockedAchievements) ? saved.unlockedAchievements : [];

      if (!merged.account.friendCode) merged.account.friendCode = generateFriendCode();
      return merged;

    // ============================================================
    // useLayout — single source of layout truth, recomputed on resize.
    // Components read tokens from here, never hardcoded pixel values.
    // ============================================================
    function useLayout() {
      const compute = () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
        const dpr = window.devicePixelRatio || 1;

        let mode;
        if (w < 400) mode = 'narrow';
        else if (w < 600) mode = 'standard';
        else if (w < 768) mode = 'wide_phone';
        else mode = isTouch ? 'tablet' : 'desktop';

        const isMobile = w < 768 || isTouch;
        const navPosition = isMobile ? 'bottom' : 'side';

        // Smart button placement — decide where utility buttons (settings/profile) anchor
        // based on actual viewport. Narrow phones shift away from edge to avoid clipping.
        let buttonAnchor = 'top-right';
        if (mode === 'narrow') buttonAnchor = 'top-center';
        else if (mode === 'desktop') buttonAnchor = 'top-right';

        return {
          mode, isMobile, isTouch, dpr,
          width: w, height: h,
          headerHeight: isMobile ? 56 : 64,
          navHeight: isMobile ? 64 : 0,
          sidebarWidth: !isMobile ? 220 : 0,
          navPosition,
          buttonAnchor
        };
      };

      const [layout, setLayout] = useState(compute);

      useEffect(() => {
        let raf;
        const onResize = () => {
          if (raf) cancelAnimationFrame(raf);
          raf = requestAnimationFrame(() => setLayout(compute()));
        };
        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', onResize);
        return () => {
          window.removeEventListener('resize', onResize);
          window.removeEventListener('orientationchange', onResize);
          if (raf) cancelAnimationFrame(raf);
        };
      }, []);

      return layout;
    }

    function getRank(totalEarned) {
      let current = RANKS[0];
      for (const r of RANKS) {
        if (totalEarned >= r.threshold) current = r;
      }
      return current;
    }
    function getNextRank(totalEarned) {
      for (const r of RANKS) {
        if (totalEarned < r.threshold) return r;
      }
      return null;
    }
    function getRepTier(rep) {
      for (const t of REP_TIERS) {
        if (rep >= t.min && rep <= t.max) return t;
      }
      return REP_TIERS[2];
    }
    function fmtStacks(n) {
      if (n >= 1000000) return (n / 1000000).toFixed(2) + 'M';
      if (n >= 10000)   return (n / 1000).toFixed(1) + 'K';
      if (n >= 1000)    return (n / 1000).toFixed(2) + 'K';
      return Math.floor(n).toLocaleString();
    }
    function vibrate(state, pattern) {
      if (!state.settings.vibration) return;
      if (navigator.vibrate) navigator.vibrate(pattern);
    }

      let ctx = null;
      function getCtx() {

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(40, t0);
        osc.frequency.exponentialRampToValueAtTime(85, t0 + 0.8);
        osc.frequency.linearRampToValueAtTime(70, t0 + 4);

        const noiseBuf = c.createBuffer(1, bufSize, c.sampleRate);
        const data = noiseBuf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = c.createBufferSource();
        noise.buffer = noiseBuf;

        // Low-pass filter
        const filter = c.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(220, t0);
        filter.Q.value = 0.8;

        // Envelope
        const gain = c.createGain();
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(0.22, t0 + 0.6);
        gain.gain.linearRampToValueAtTime(0.16, t0 + 3.5);
        gain.gain.linearRampToValueAtTime(0, t0 + 5);

        osc.connect(filter);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(c.destination);

        osc.start(t0);
        noise.start(t0);
        osc.stop(t0 + 5);
        noise.stop(t0 + 5);
      }

      // Door close — short percussive thud
      function doorClose(soundOn) {
        if (!soundOn) return;
        const c = getCtx();
        if (!c) return;
        const t0 = c.currentTime;

        const bufSize = c.sampleRate * 0.15;
        const buf = c.createBuffer(1, bufSize, c.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.3));
        const src = c.createBufferSource();
        src.buffer = buf;

        const filter = c.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 180;

        const gain = c.createGain();
        gain.gain.setValueAtTime(0.55, t0);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.15);

        src.connect(filter);
        filter.connect(gain);
        gain.connect(c.destination);
        src.start(t0);

          const t0 = c.currentTime + step * 0.45;
          const bufSize = c.sampleRate * 0.08;
          const buf = c.createBuffer(1, bufSize, c.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.2));
          const src = c.createBufferSource();
          src.buffer = buf;
          const filter = c.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 350;
          const gain = c.createGain();
          gain.gain.setValueAtTime(0.18, t0);
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.08);

          filter.connect(gain);
          gain.connect(c.destination);
          src.start(t0);

        const bufSize = c.sampleRate * 3;
        const buf = c.createBuffer(1, bufSize, c.sampleRate);

        for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
        const src = c.createBufferSource();
        src.buffer = buf;

        const filter = c.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 380;

        const gain = c.createGain();

        if (cachedVoices && cachedVoices.length) return cachedVoices;

          return true;
        } catch (e) {
          console.warn('[HustleFire] registerFriendCode failed', e);
          return false;
        }
      }

      async function findUserByCode(code) {
        if (!ready || !code) return null;
        const doc = await db.collection('friendCodes').doc(code).get();
        return doc.exists ? doc.data() : null; // { uid, displayName }
      }

      // ---- Friends list ----
      async function addFriend(myUid, friendUid, friendCode, friendName) {
        if (!ready || !myUid || !friendUid) return false;
        if (myUid === friendUid) throw new Error("Can't add yourself.");
        try {
          await db.collection('users').doc(myUid).collection('friends').doc(friendUid).set({
            friendUid: friendUid,
            friendCode: friendCode,
            displayName: friendName || 'Marcus',
            addedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          return true;
        } catch (e) {
          console.warn('[HustleFire] addFriend failed', e);
          throw e;
        }
      }

      async function removeFriend(myUid, friendUid) {
        if (!ready || !myUid || !friendUid) return false;
        try {
          await db.collection('users').doc(myUid).collection('friends').doc(friendUid).delete();
          return true;
        } catch (e) {
          console.warn('[HustleFire] removeFriend failed', e);
          return false;
        }
      }

      async function listFriends(myUid) {
        if (!ready || !myUid) return [];
        try {
          const snap = await db.collection('users').doc(myUid).collection('friends').orderBy('addedAt', 'desc').get();
          return snap.docs.map(d => d.data());
        } catch (e) {
          console.warn('[HustleFire] listFriends failed', e);
          return [];
        }
      }

      // ---- QR generation (using qrcode-generator global) ----
      function generateQRSvg(text, opts) {
        if (typeof qrcode === 'undefined') return '';
        try {
          const qr = qrcode(0, 'L');
          qr.addData(text || '');
          qr.make();
          return qr.createSvgTag({ scalable: true, margin: 1 });
        } catch (e) {
          return '';
        }
      }

      return {
        ready: () => ready,
        initError: () => initError,
        isCapacitor,
        onAuthChange, getCurrentUser, checkRedirectResult,
        signInAnon, signUpEmail, signInEmail, signInGoogle, signOut,
        pullSave, pushSave, getSaveMeta,
        upsertUserProfile, getUserSummary,
        registerFriendCode, findUserByCode,
        addFriend, removeFriend, listFriends,
        generateQRSvg
      };
    })();

    // ============================================================
    // EndOfShiftSequence — multi-stage cinematic
    // Stage 0: Truck idling at curb (engine sound)
    // Stage 1: Truck drives off
    // Stage 2: Goodbye dialogue (Ray + Marcus)
    // Stage 3: Marcus walks home (footsteps)
    // Stage 4: House with sleeping Z's (snore)
    // Stage 5: Summary with stats + "Get Some Sleep" button
    // User can skip to Stage 5 at any time
    // ============================================================
    function EndOfShiftSequence({ summary, soundOn, onDismiss }) {
      const { useState, useEffect, useRef } = React;
      const [stage, setStage] = useState(0);
      const timerRef = useRef(null);
      const STAGE_DURATIONS = [2600, 2400, 3400, 5000, 3000]; // ms per auto-advancing stage

      useEffect(() => {
        // Audio cue on stage entry
        if (stage === 0) AudioFX.engineRumble(soundOn);
        else if (stage === 2) AudioFX.doorClose(soundOn);
        else if (stage === 3) AudioFX.footsteps(soundOn);
        else if (stage === 4) AudioFX.snore(soundOn);

        // Auto-advance
        if (stage < 5) {
          timerRef.current = setTimeout(() => setStage(s => s + 1), STAGE_DURATIONS[stage]);
        }
        return () => { if (timerRef.current) clearTimeout(timerRef.current); };
      }, [stage, soundOn]);

      const skip = () => {
        if (timerRef.current) clearTimeout(timerRef.current);
        setStage(5);
      };

      const truck = (driveOff) => e('div', {
        className: 'truck ' + (driveOff ? 'stage-drive' : 'stage-idle'),
        key: driveOff ? 'driving' : 'idle'

        driveOff ? null : e('div', { className: 'truck-smoke' }),
        e('div', { className: 'truck-body' }),
        e('div', { className: 'truck-cab' }),
        e('div', { className: 'truck-window' }),
        e('div', { className: 'truck-wheel left' }),
        e('div', { className: 'truck-wheel right' })
      );

      let scene = null;
      let caption = null;
      let dialogue = null;

      if (stage === 0) {
        scene = truck(false);
        caption = 'Engine starts up...';
      } else if (stage === 1) {
        scene = truck(true);
        caption = "Ray pulls it down the block.";
      } else if (stage === 2) {
        caption = '5th and Main';
        dialogue = e('div', { className: 'end-dialogue' },
          e('strong', null, 'Ray: '), '"Get home safe, kid. Lock that back door."',
          e('br'),
          e('strong', null, 'Marcus: '), '"Yeah, Unc. See you tomorrow."'
        );
      } else if (stage === 3) {
        scene = e('div', { className: 'walking-figure stage-walk-right' },
          e(WalkingMarcus, null)
        );
        caption = 'Walking home.';
      } else if (stage === 4) {
        scene = e('div', { className: 'house' },

          e('div', { className: 'house-body' }),
          e('div', { className: 'house-window' }),
          e('div', { className: 'zzz' }, 'zZ'),
          e('div', { className: 'zzz', style: { animationDelay: '0.9s' } }, 'zZ'),
          e('div', { className: 'zzz', style: { animationDelay: '1.7s' } }, 'zZ')
        );
        caption = 'Home. Sleep. Tomorrow.';
      }

      return e('div', { className: 'shift-end-overlay' },
        e('div', { className: 'shift-end-card' },
          stage < 5
            ? e('div', null,
                e('h2', { className: 'shift-end-title display-font', style: { marginTop: 0 } }, "Shift Over"),
                scene ? e('div', { className: 'end-stage' },

                  caption ? e('div', { className: 'end-caption' }, caption) : null
                ) : null,
                dialogue,
                !scene && !dialogue ? e('div', { className: 'end-stage' },
                  caption ? e('div', { className: 'end-caption' }, caption) : null
                ) : null,
                e('button', {
                  className: 'btn btn-ghost',
                  style: { width: '100%', marginTop: 12, fontSize: 12, opacity: 0.7 },
                  onClick: skip
                }, 'Skip ›')
              )
            : e('div', null,
                e('div', { className: 'shift-end-night' }, '🌙'),
                e('h2', { className: 'shift-end-title display-font' }, "Day's Done"),
                e('div', { className: 'shift-end-quote' },

    // ============================================================
    // Dynamic profile story — branches on multiple dimensions
    // (money tier × reputation × skill rate × experience)
    // Returns array of {text, em} segments that ProfileScreen renders
    // ============================================================
    function buildMarcusStory(state) {
      const earned = state.totalEarned || 0;
      const rep = state.reputation || 0;
      const customers = state.customersServed || 0;
      const failRate = customers > 0 ? state.failedOrders / customers : 0;
      const perfectRate = customers > 0 ? state.perfectOrders / customers : 0;
      const graduated = !!(state.account && state.account.graduated);
      const out = [];

      // Post-graduation: everything that follows is epilogue
      if (graduated) {
        out.push({ text: "You did the impossible. Started as the " });
        out.push({ text: "dishwasher", em: true });
        out.push({ text: " who couldn't afford rent — ended up running the truck, then walking away with " });
        out.push({ text: "something bigger", em: true });
        out.push({ text: " waiting for you. Ray hugged you when you told him. He said he saw it coming. You're still around the block, but your eyes are already on what's next." });
        return out;
      }

      // Main story by career tier (mirrors rank progression)
      if (earned < 100) {
        // Dishwasher
        out.push({ text: "Nineteen, broke, evicted last week. " });
        out.push({ text: "Uncle Ray", em: true });
        out.push({ text: " gave you a shot — bottom of the rung, scrubbing dishes and prepping ingredients. 5th and Main. The block doesn't know your name yet." });
      } else if (earned < 1000) {
        // Prep Cook
        out.push({ text: "Ray moved you to " });
        out.push({ text: "prep", em: true });
        out.push({ text: " — chopping, marinating, getting the line ready for the rush. You're not in front of customers yet, but you're learning the rhythm. Ray nods more than he scolds." });
      } else if (earned < 10000) {
        // Line Cook
        out.push({ text: "You're on the " });
        out.push({ text: "line now", em: true });
        out.push({ text: ". Actually cooking. The window is yours during the rush. People walk past and they recognize the work — the burgers come out hot, the orders come out right." });
      } else if (earned < 100000) {
        // Head Cook
        out.push({ text: "Head cook. " });
        out.push({ text: "You run the line", em: true });
        out.push({ text: " when Ray's not there. Regulars come by name. You've got real money on you for the first time in your life. Ray talks about expanding. The back room calls every now and then." });
      } else if (earned < 1000000) {
        // Manager
        out.push({ text: "Ray gave you the " });
        out.push({ text: "manager keys", em: true });
        out.push({ text: ". You hire, you fire, you handle the suppliers. Some days Ray doesn't even come in. The block knows your name now — and the truck runs on what you decide." });
      } else {
        // Owner — final pre-graduation tier
        out.push({ text: "You " });
        out.push({ text: "bought the truck", em: true });
        out.push({ text: " from Ray. He's still around — he comes by, drinks coffee, gives advice you don't always take. Started with $12 and a couch to sleep on. Now you're the one telling the new kid where the sponges are." });
      }

      // Reputation flavor (kicks in after a few customers — needs sample size)
      if (customers > 5) {
        if (rep > 80) {
          out.push({ text: " " });
          out.push({ text: "Word on the block is good", em: true });
          out.push({ text: " — you treat people right." });
        } else if (rep < 30) {
          out.push({ text: " But the block " });
          out.push({ text: "doesn't trust you", em: true });
          out.push({ text: " — too many bad calls." });
        }
      }

      // Skill flavor (kicks in after 10 customers — needs more sample)
      if (customers > 10) {
        if (perfectRate > 0.5) {
          out.push({ text: " Ray's noticed: you " });
          out.push({ text: "got a touch", em: true });
          out.push({ text: "." });
        } else if (failRate > 0.3) {
          out.push({ text: " Ray says you " });
          out.push({ text: "need to focus", em: true });
          out.push({ text: " more." });
        }
      }

      // Experience flavor (50+ customers = veteran)
      if (customers >= 50 && customers < 200) {
        out.push({ text: " You know the rhythm now — the morning rush, the afternoon lull, the after-work crowd." });
      } else if (customers >= 200) {
        out.push({ text: " You've worked enough shifts to lose count. The truck feels like home." });
      }

      return out;
    }

    // Toast hook
    // ============================================================
    function useToasts() {
      const [toasts, setToasts] = useState([]);
      const idRef = useRef(0);
      const push = useCallback((msg, kind) => {
        const id = ++idRef.current;
        setToasts(t => [...t, { id, msg, kind: kind || 'amber' }]);
        setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3000);
      }, []);
      return { toasts, push };
    }

    // ============================================================
    // App state hook — central store + persistence + idle ticker
    // ============================================================
    function useGameState() {
      const [state, setState] = useState(() => {
        const saved = loadSave();
        if (saved) return migrateState(saved);
        return defaultState();
      });

      // Persist
      useEffect(() => {
        saveSave(state);
      }, [state]);

      // Idle wage ticker
      useEffect(() => {
        const tick = setInterval(() => {
          setState(s => {
            const now = Date.now();
            const elapsedSec = Math.min((now - s.lastIdleTimestamp) / 1000, IDLE_CAP_HOURS * 3600);
            const rank = getRank(s.totalEarned);
            const wagesEarned = elapsedSec * rank.wagePerSec * 0.05; // small per-tick increment
            if (wagesEarned <= 0) return s;
            return {
              ...s,
              stacks: s.stacks + wagesEarned,
              totalEarned: s.totalEarned + wagesEarned,
              lastIdleTimestamp: now
            };
          });
        }, TICK_MS);
        return () => clearInterval(tick);
      }, []);

      // On mount: compute offline accumulation
      useEffect(() => {
        setState(s => {
          const now = Date.now();
          const elapsedSec = Math.min((now - s.lastIdleTimestamp) / 1000, IDLE_CAP_HOURS * 3600);
          const rank = getRank(s.totalEarned);
          const offlineWages = elapsedSec * rank.wagePerSec;
          if (offlineWages < 1) return s;
          return {
            ...s,
            stacks: s.stacks + offlineWages,
            totalEarned: s.totalEarned + offlineWages,
            lastIdleTimestamp: now
          };
        });
      }, []);

      const addStacks = useCallback((amount) => {
        setState(s => ({
          ...s,
          stacks: Math.max(0, s.stacks + amount),
          totalEarned: amount > 0 ? s.totalEarned + amount : s.totalEarned,
          totalSpent: amount < 0 ? s.totalSpent + Math.abs(amount) : s.totalSpent
        }));
      }, []);

      const addReputation = useCallback((delta) => {
        setState(s => ({ ...s, reputation: Math.max(0, Math.min(100, s.reputation + delta)) }));
      }, []);

      const recordOrder = useCallback((result) => {
        setState(s => ({
          ...s,
          customersServed: s.customersServed + 1,
          perfectOrders: result === 'perfect' ? s.perfectOrders + 1 : s.perfectOrders,
          failedOrders: result === 'failed' ? s.failedOrders + 1 : s.failedOrders
        }));
      }, []);

      const updateSettings = useCallback((patch) => {
        setState(s => ({ ...s, settings: { ...s.settings, ...patch } }));
      }, []);

      const markNewsRead = useCallback((version) => {
        setState(s => ({ ...s, newsLastReadVersion: version }));
      }, []);

      const updateAccount = useCallback((patch) => {
        setState(s => ({ ...s, account: { ...s.account, ...patch } }));
      }, []);

      const logEvent = useCallback((eventId) => {
        setState(s => ({
          ...s,
          eventLog: [...(s.eventLog || []).slice(-9), eventId] // keep last 10
        }));
      }, []);

      const completeJob = useCallback(() => {
        setState(s => ({ ...s, jobsCompleted: (s.jobsCompleted || 0) + 1 }));
      }, []);

      // Manually unlock an achievement (used for triggered-not-checked ones like 'made_a_friend')
      const unlockAchievement = useCallback((id) => {
        setState(s => {
          const cur = Array.isArray(s.unlockedAchievements) ? s.unlockedAchievements : [];
          if (cur.indexOf(id) >= 0) return s;
          return { ...s, unlockedAchievements: [...cur, id] };
        });
      }, []);

      // Auto-detect achievements on state changes (only check fields that matter)
      useEffect(() => {
        setState(s => {
          const cur = Array.isArray(s.unlockedAchievements) ? s.unlockedAchievements : [];
          const curSet = new Set(cur);
          const newly = [];
          for (let i = 0; i < ACHIEVEMENTS.length; i++) {
            const a = ACHIEVEMENTS[i];
            if (!curSet.has(a.id)) {
              try {
                if (a.check && a.check(s)) newly.push(a.id);
              } catch (e) { /* ignore bad check */ }
            }
          }
          if (newly.length === 0) return s;
          return { ...s, unlockedAchievements: [...cur, ...newly] };
        });
      }, [
        state.customersServed, state.perfectOrders, state.failedOrders,
        state.totalEarned, state.reputation,
        state.account && state.account.graduated
      ]);

      return {
        state, setState,
        addStacks, addReputation, recordOrder,
        updateSettings, markNewsRead, updateAccount,
        logEvent, completeJob, unlockAchievement
      };
    }

          ? e('div', { className: 'card', style: { marginBottom: 16, borderColor: 'var(--line-strong)' } },
              e('div', { style: { fontSize: 13, color: 'var(--text-dim)', lineHeight: 1.6 } },
                e('strong', { style: { color: 'var(--amber)' } }, "Ray: "),
                "“Work the truck. Don't mess up my orders. And whatever you do — stay out the back room.”"
              )
            )
          : null,
        // Rank progress card
        e('div', { className: 'card', style: { marginBottom: 12 } },
          e('div', { style: { display: 'flex', justifyContent: 'space-between', marginBottom: 8 } },
            e('div', null,
              e('div', { style: { fontSize: 11, color: 'var(--text-faint)', textTransform: 'uppercase', letterSpacing: 1 } }, 'Rank'),
              e('div', { className: 'display-font', style: { fontSize: 22, color: 'var(--amber)' } }, rank.name)
            ),
            nextRank
              ? e('div', { style: { textAlign: 'right' } },
                  e('div', { style: { fontSize: 11, color: 'var(--text-faint)' } }, 'Next: ' + nextRank.name),
                  e('div', { style: { fontSize: 13, color: 'var(--text-dim)' } },
                    fmtStacks(nextRank.threshold - state.totalEarned) + ' to go')
                )
              : e('div', { style: { color: 'var(--gold)' } }, '🏆 MAX')
          ),
          e('div', { className: 'rep-bar-track' },
            e('div', { className: 'rep-bar-fill', style: { width: progress + '%', background: 'linear-gradient(90deg, var(--amber-deep), var(--amber))' } })
          )
        ),
        // Reputation card
        e('div', { className: 'card', style: { marginBottom: 12 } },
          e('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 } },
            e('div', null,
              e('div', { style: { fontSize: 11, color: 'var(--text-faint)', textTransform: 'uppercase', letterSpacing: 1 } }, 'Reputation'),
              e('div', { className: 'display-font', style: { fontSize: 20, color: 'var(--amber)' } }, tier.name)
            ),
            e('div', { style: { fontSize: 22, fontWeight: 800, color: 'var(--amber)' } }, Math.floor(state.reputation))
          ),
          e('div', { className: 'rep-bar-track' },
            e('div', { className: 'rep-bar-fill', style: { width: state.reputation + '%' } })
          ),
          e('div', { style: { fontSize: 12, color: 'var(--text-faint)', marginTop: 8 } }, tier.desc)
        ),
        // Stats
        e('div', { className: 'stats-grid', style: { marginBottom: 16 } },
          e('div', { className: 'stat-block' },
            e('div', { className: 'stat-label' }, 'Customers'),
            e('div', { className: 'stat-value' }, state.customersServed)
          ),
          e('div', { className: 'stat-block' },
            e('div', { className: 'stat-label' }, 'Perfect'),
            e('div', { className: 'stat-value' }, state.perfectOrders)
          ),
          e('div', { className: 'stat-block' },
            e('div', { className: 'stat-label' }, 'Total Earned'),
            e('div', { className: 'stat-value' }, fmtStacks(state.totalEarned))
          ),
          e('div', { className: 'stat-block' },
            e('div', { className: 'stat-label' }, 'Wages/sec'),
            e('div', { className: 'stat-value' }, '+' + rank.wagePerSec.toFixed(2))
          )
        ),
        // CTA buttons
        e('button', {
          className: 'btn btn-primary',
          style: { width: '100%', fontSize: 16, padding: '14px 18px', marginBottom: 10 },
          onClick: () => onGoTo('work')
        }, '🍔 Work the Food Truck'),
        e('button', {
          className: 'btn btn-ghost',
          style: { width: '100%', marginBottom: 10 },
          onClick: () => onGoTo('arcade'),
          disabled: true,
          title: 'The back room — coming soon'
        }, '🎰 Back Room (Coming Soon)')
      );
    }

    // ============================================================
    // Food Truck Mini-Game
    // ============================================================
    function FoodTruckScreen({ state, addStacks, addReputation, recordOrder, logEvent, completeJob, toast }) {
      const tier = getRepTier(state.reputation);

      const [order, setOrder] = useState(null);          // current order: array of emojis (with possible repeats)
      const [plate, setPlate] = useState([]);            // current plate contents
      const [timeLeft, setTimeLeft] = useState(0);
      const [maxTime, setMaxTime] = useState(0);
      const [result, setResult] = useState(null);
      const [event, setEvent] = useState(null);
      const [activeBuffs, setActiveBuffs] = useState({});
      const [customerFace, setCustomerFace] = useState('😀');
      const [shiftActive, setShiftActive] = useState(false);
      const [shiftEndSummary, setShiftEndSummary] = useState(null);
      const [shiftStartSnapshot, setShiftStartSnapshot] = useState(null);
      const [draggingItem, setDraggingItem] = useState(null);
      const [dragPos, setDragPos] = useState({ x: 0, y: 0 });
      const [overPlate, setOverPlate] = useState(false);

      const orderTimerRef = useRef(null);
      const plateRef = useRef(null);
      const nextCustomerTimeoutRef = useRef(null);

      // Background ambience: starts when this screen mounts (if enabled), stops on unmount
      useEffect(() => {
        if (state.settings.ambience && state.settings.sound) {
          AudioFX.startAmbience(true);
        }
        return () => {
          AudioFX.stopAmbience();
          AudioFX.cancelSpeech(); // stop any TTS that was in flight when leaving the screen
        };
      }, [state.settings.ambience, state.settings.sound]);

      // Item lookup helper
      const itemByEmoji = (emoji) => MENU_ITEMS.find(m => m.emoji === emoji);

      const generateOrder = () => {
        const len = 2 + Math.floor(Math.random() * 3); // 2-4 items
        const o = [];
        for (let i = 0; i < len; i++) o.push(INGREDIENTS[Math.floor(Math.random() * INGREDIENTS.length)]);
        return o;
      };

      const startNewCustomer = useCallback(() => {
        if (!event && Math.random() < 0.15) {
          const eligible = EVENTS.filter(ev =>
            (ev.jobs.includes('food_truck') || ev.jobs.includes('*')) &&
            !state.eventLog.slice(-3).includes(ev.id)
          );
          if (eligible.length) {
            const picked = eligible[Math.floor(Math.random() * eligible.length)];
            setEvent(picked);
            // BUG FIX: track event firing in eventLog so it doesn't repeat back-to-back
            logEvent(picked.id);
            return;
          }
        }

        const newOrder = generateOrder();
        // More time per item since now you have to assemble (not just tap)
        const baseTime = 12 + (newOrder.length - 2) * 3;
        const time = baseTime + (activeBuffs.timerPenalty || 0);
        setOrder(newOrder);
        setPlate([]);
        setTimeLeft(time);
        setMaxTime(time);
        setCustomerFace(CUSTOMER_FACES[Math.floor(Math.random() * CUSTOMER_FACES.length)]);
        setResult(null);

        // SFX: sizzle on customer arrival
        AudioFX.sizzle(!!state.settings.sound);

        // Customer voice (TTS): speak the order — large pool of varied phrasings + scenarios
        if (state.settings.voices && newOrder.length > 0) {
          const itemNames = newOrder.map(emoji => {
            const item = MENU_ITEMS.find(m => m.emoji === emoji);
            return item ? item.name.toLowerCase() : '';
          }).filter(Boolean);

          // Build "a X and a Y and a Z" string (article tweaked for vowel starts)
          const article = (word) => /^[aeiou]/i.test(word) ? 'an ' : 'a ';
          const itemPhrase = itemNames.map(n => article(n) + n).join(' and ');
          // Plural-only version for single-item lines: "two burgers" feel
          const firstItem = itemNames[0];
          const lastItem = itemNames[itemNames.length - 1];

          // 35+ scenario lines — picked at random per customer
          const phrasings = [
            // Polite
            "Could I get " + itemPhrase + ", please?",
            "Hi, I'll have " + itemPhrase + ".",
            "Excuse me — " + itemPhrase + " when you have a moment.",
            "Hey there. " + itemPhrase + ", thanks.",
            "Good afternoon. " + itemPhrase + ", please.",
            // Casual / regular
            "Yo, lemme get " + itemPhrase + ".",
            "Just " + itemPhrase + " today.",
            "Hit me with " + itemPhrase + ".",
            "Gimme " + itemPhrase + ".",
            "Same as always — " + itemPhrase + ".",
            "Yeah, " + itemPhrase + " — that's it.",
            "I'll take " + itemPhrase + ".",
            // In-a-rush
            "Quick — " + itemPhrase + ", I'm late.",
            itemPhrase + ", fast as you can.",
            "Make it quick — " + itemPhrase + ".",
            "Running late. " + itemPhrase + ".",
            // Hungry / craving
            "I am starving. " + itemPhrase + ", let's go.",
            "Been thinking about " + (firstItem || 'food') + " all day. " + itemPhrase + ".",
            "I need " + itemPhrase + " in my life right now.",
            "Smelled this from the corner. " + itemPhrase + ".",
            // Gruff / impatient
            itemPhrase + ".",
            "One " + (firstItem || 'order') + (itemNames.length > 1 ? ", and " + article(itemNames[1]) + itemNames[1] : '') + ".",
            "Look — " + itemPhrase + ".",
            "Just give me " + itemPhrase + ".",
            // Indecisive / friendly
            "Hmm... yeah, " + itemPhrase + ".",
            "You know what, " + itemPhrase + ".",
            "Let's do " + itemPhrase + ".",
            "Surprise me. Kidding — " + itemPhrase + ".",
            // Item-specific commentary (chosen if order is short)
            firstItem === 'burger'  ? "Heard the burgers here are no joke. " + itemPhrase + "." : null,
            firstItem === 'pizza'   ? "Pizza guy! " + itemPhrase + "." : null,
            firstItem === 'taco'    ? "Tuesday calls for tacos. " + itemPhrase + "." : null,
            firstItem === 'fries'   ? "Mostly here for the fries. " + itemPhrase + "." : null,
            firstItem === 'hot dog' ? "Classic. " + itemPhrase + "." : null,
            firstItem === 'salad'   ? "Trying to eat clean. " + itemPhrase + "." : null,
            firstItem === 'donut'   ? "It's a donut kind of day. " + itemPhrase + "." : null,
            firstItem === 'drink'   ? "Thirsty. " + itemPhrase + "." : null,
            // Reputation flavor — only if last item is a drink
            lastItem === 'drink' && itemNames.length > 1 ? itemPhrase + ". Cold one, please." : null,
            // Generic closers
            "Yeah, " + itemPhrase + " sounds good.",
            "Alright, " + itemPhrase + " it is."
          ].filter(Boolean);

          const phrase = phrasings[Math.floor(Math.random() * phrasings.length)];
          // Small delay so sizzle is heard first
          setTimeout(() => AudioFX.speak(phrase, true), 350);
        }
      }, [event, activeBuffs, state.eventLog, state.settings.sound, state.settings.voices]);

      const startShift = () => {
        setShiftStartSnapshot({
          customers: state.customersServed,
          earned: state.totalEarned,
          rep: state.reputation
        });
        setShiftActive(true);
        startNewCustomer();
      };

      const endShift = () => {
        setShiftActive(false);
        setOrder(null);
        setPlate([]);
        setResult(null);
        setEvent(null);
        if (orderTimerRef.current) clearInterval(orderTimerRef.current);
        // BUG FIX: clear dangling next-customer timeout so endShift is final
        if (nextCustomerTimeoutRef.current) {
          clearTimeout(nextCustomerTimeoutRef.current);
          nextCustomerTimeoutRef.current = null;
        }
        // BUG FIX: increment jobsCompleted so the DAY N counter advances
        completeJob();
        if (shiftStartSnapshot) {
          const served = state.customersServed - shiftStartSnapshot.customers;
          const earned = Math.floor(state.totalEarned - shiftStartSnapshot.earned);
          const repDelta = Math.round(state.reputation - shiftStartSnapshot.rep);
          setShiftEndSummary({ served, earned, repDelta });
        } else {
          setShiftEndSummary({ served: 0, earned: 0, repDelta: 0 });
        }
      };

      const dismissShiftEnd = () => setShiftEndSummary(null);

      useEffect(() => {
        const isMobileLikely = typeof window !== 'undefined' && window.innerWidth < 768;
        const shouldLock = isMobileLikely && shiftActive && !!order;
        document.body.classList.toggle('scroll-locked', shouldLock);
        return () => document.body.classList.remove('scroll-locked');
      }, [shiftActive, order]);

      useEffect(() => {
        if (!order || result) return;
        orderTimerRef.current = setInterval(() => {
          setTimeLeft(t => {
            if (t <= 0.1) {
              clearInterval(orderTimerRef.current);
              return 0;
            }
            return t - 0.1;
          });
        }, 100);
        return () => clearInterval(orderTimerRef.current);
      }, [order, result]);

      useEffect(() => {
        if (order && timeLeft <= 0 && !result) {
          finishOrder('failed');
        }
      }, [timeLeft, order, result]);

      const finishOrder = (resultKey) => {
        const r = RESULT_TYPES[resultKey];
        const tipMult = (activeBuffs.tipMult || 1) * tier.tip;
        const stacksEarned = Math.floor(r.baseStacks * tipMult);
        if (stacksEarned !== 0) addStacks(stacksEarned);
        if (r.repDelta !== 0) addReputation(r.repDelta);
        recordOrder(resultKey);
        setResult({ key: resultKey, stacks: stacksEarned });
        vibrate(state, resultKey === 'perfect' ? [40, 40, 80] : resultKey === 'failed' ? [200] : [60]);

        // SFX: stop any currently-speaking customer voice (order is done)
        AudioFX.cancelSpeech();
        // SFX: bell ding on success, no chime on a fail
        if (resultKey !== 'failed' && state.settings.sound) AudioFX.bellDing(true);
        // SFX: coin drop when earning Stacks
        if (stacksEarned > 0 && state.settings.sound) AudioFX.coinDrop(true);

        // BUG FIX: clear any prior queued next-customer call before scheduling a new one
        if (nextCustomerTimeoutRef.current) clearTimeout(nextCustomerTimeoutRef.current);
        nextCustomerTimeoutRef.current = setTimeout(() => {
          nextCustomerTimeoutRef.current = null;
          if (shiftActive) startNewCustomer();
        }, 1800);
      };

      // ============= ORDER MATCHING =============
      // Compare plate contents (multiset) to order requirements (multiset)
      const matchOrder = (plateArr, orderArr) => {
        const orderCount = {};
        const plateCount = {};
        for (const o of orderArr) orderCount[o] = (orderCount[o] || 0) + 1;
        for (const p of plateArr) plateCount[p] = (plateCount[p] || 0) + 1;
        let missing = 0, extra = 0;
        const allKeys = new Set([...Object.keys(orderCount), ...Object.keys(plateCount)]);
        for (const k of allKeys) {
          const need = orderCount[k] || 0;
          const have = plateCount[k] || 0;
          if (have < need) missing += (need - have);
          else if (have > need) extra += (have - need);
        }
        return { exact: missing === 0 && extra === 0, missing, extra };
      };

      const handleServe = () => {
        if (!order || result || plate.length === 0) return;
        const match = matchOrder(plate, order);
        const fractionLeft = timeLeft / maxTime;
        let resultKey;
        if (match.exact && fractionLeft >= 0.5) resultKey = 'perfect';
        else if (match.exact && fractionLeft >= 0.25) resultKey = 'good';
        else if (match.exact) resultKey = 'okay';
        else if ((match.missing + match.extra) <= 1) resultKey = 'bad';
        else resultKey = 'failed';
        finishOrder(resultKey);
      };

      // Plate item removal — tap to remove (in case of mistake)
      const removeFromPlate = (idx) => {
        if (result) return;
        setPlate(p => p.filter((_, i) => i !== idx));
      };

      // ============= DRAG-AND-DROP =============
      const handleStartDrag = (item, e) => {
        if (result || !order) return;
        e.preventDefault();
        const point = e.touches && e.touches[0] ? e.touches[0] : e;
        setDraggingItem(item);
        setDragPos({ x: point.clientX, y: point.clientY });
      };

      // Global pointer tracking while dragging
      useEffect(() => {
        if (!draggingItem) return;

        const move = (ev) => {
          const point = ev.touches && ev.touches[0] ? ev.touches[0] : ev;
          const x = point.clientX, y = point.clientY;
          if (x !== undefined && y !== undefined) {
            setDragPos({ x, y });
            const rect = plateRef.current && plateRef.current.getBoundingClientRect();
            if (rect) {
              setOverPlate(x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom);
            }
          }
        };

        const up = (ev) => {
          const point = ev.changedTouches && ev.changedTouches[0]
            ? ev.changedTouches[0]
            : ev;
          const x = point.clientX, y = point.clientY;
          const rect = plateRef.current && plateRef.current.getBoundingClientRect();
          if (rect && x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
            setPlate(p => [...p, draggingItem]);
            vibrate(state, [30]);
          }
          setDraggingItem(null);
          setOverPlate(false);
        };

        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
        window.addEventListener('pointercancel', up);
        return () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          window.removeEventListener('pointercancel', up);
        };
      }, [draggingItem]);

      const resolveEvent = (option) => {
        if (!event) return;
        const effect = option ? option.effect : (event.effect || {});
        let summary = '';
        if (effect.stacks) {
          addStacks(effect.stacks);
          summary += (effect.stacks > 0 ? '+' : '') + effect.stacks + ' Stacks. ';
        }
        if (effect.rep) {
          addReputation(effect.rep);
          summary += (effect.rep > 0 ? '+' : '') + effect.rep + ' rep. ';
        }
        // Auto-perfect: Loyal Regular skips the drag-drop and credits a perfect order.
        if (effect.autoPerfect) {
          const tipMult = activeBuffs.tipMult || 1;
          const bonus = Math.round(25 * tipMult);
          addStacks(bonus);
          addReputation(2);
          recordOrder('perfect');
          summary += '+' + bonus + ' Stacks (perfect). +2 rep. ';
        }
        // Free stock: supplier deal — flat bonus.
        if (effect.freeStock) {
          addStacks(50);
          summary += '+50 Stacks (free supply). ';
        }
        if (effect.tipMult || effect.customerMult || effect.timerPenalty) {
          setActiveBuffs(b => ({ ...b, ...effect }));
          if (effect.durationMs) {
            setTimeout(() => {
              setActiveBuffs(b => {
                const copy = { ...b };
                if (effect.tipMult) delete copy.tipMult;
                if (effect.customerMult) delete copy.customerMult;
                if (effect.timerPenalty) delete copy.timerPenalty;
                return copy;
              });
            }, effect.durationMs);
          }
        }
        toast(event.title + (summary ? ' — ' + summary : ''), 'amber');
        setEvent(null);
        setTimeout(() => startNewCustomer(), 400);
      };

      // End-of-shift overlay (shown after endShift while summary is set)
      const endOverlay = shiftEndSummary
        ? e(EndOfShiftSequence, {
            summary: shiftEndSummary,
            soundOn: !!state.settings.sound,
            onDismiss: dismissShiftEnd
          })
        : null;

      // Pre-shift screen — theatrical opening + chalkboard menu
      if (!shiftActive) {
        const dayNum = Math.floor(state.jobsCompleted) + 1;
        return e('div', { className: 'main has-bottomnav' },
          e('div', { className: 'screen-header' },
            e('h1', { className: 'screen-title display-font' }, "Ray's Food Truck"),
            e('p', { className: 'screen-subtitle' }, '5th and Main • Open from dawn till you call it')
          ),

          // Theatrical intro card
          e('div', { className: 'shift-intro' },
            e('div', { className: 'shift-intro-day' }, 'DAY ' + dayNum + ' · 5TH AND MAIN'),
            e('h2', { className: 'shift-intro-title' }, "Ray's"),
            e('button', {
              className: 'open-sign',
              onClick: startShift,
              title: 'Click to open shift'
            }, 'OPEN'),
            e('div', { className: 'ray-quote' },
              e('strong', null, 'Ray: '),
              state.reputation >= 60
                ? '"Crew\'s lookin\' good. Don\'t get cocky."'
                : state.reputation < 30
                  ? '"You\'re draggin\' my name through the mud. Fix it."'
                  : '"Don\'t burn nothin\'. People talkin\' already."'
            )
          ),

          // Menu board with prices
          e('div', { className: 'menu-board' },
            e('div', { className: 'menu-title' }, "TODAY'S MENU"),
            MENU_ITEMS.map(item =>
              e('div', { className: 'menu-row', key: item.emoji },
                e('span', { className: 'menu-emoji' }, item.emoji),
                e('span', { className: 'menu-name' }, item.name),
                e('span', { className: 'menu-dots' }),
                e('span', { className: 'menu-price' }, '$' + item.price)
              )
            )
          ),

          // Tip / flow info
          e('div', { className: 'card', style: { marginBottom: 16 } },
            e('div', { style: { display: 'flex', justifyContent: 'space-between' } },
              e('div', null,
                e('div', { style: { fontSize: 11, color: 'var(--text-faint)' } }, 'Customer flow'),
                e('div', { style: { fontSize: 16, fontWeight: 700 } }, Math.round(tier.flow * 100) + '%')
              ),
              e('div', null,
                e('div', { style: { fontSize: 11, color: 'var(--text-faint)' } }, 'Tip multiplier'),
                e('div', { style: { fontSize: 16, fontWeight: 700 } }, '×' + tier.tip.toFixed(2))
              ),
              e('div', null,
                e('div', { style: { fontSize: 11, color: 'var(--text-faint)' } }, 'Reputation'),
                e('div', { style: { fontSize: 16, fontWeight: 700, color: 'var(--amber)' } }, tier.name)
              )
            )
          ),

          e('button', {
            className: 'btn btn-primary',
            style: { width: '100%', fontSize: 16, padding: '14px 18px' },
            onClick: startShift
          }, '🚚 Open the Window'),

          endOverlay
        );
      }

      // Compute order summary for the receipt
      const orderSummary = order ? (() => {
        const counts = {};
        for (const o of order) counts[o] = (counts[o] || 0) + 1;
        const lines = Object.entries(counts).map(([emoji, count]) => {
          const item = itemByEmoji(emoji);
          return { emoji, count, name: item ? item.name : '???', subtotal: count * (item ? item.price : 0) };
        });
        const total = lines.reduce((sum, l) => sum + l.subtotal, 0);
        return { lines, total };
      })() : null;

      // Active shift
      return e('div', { className: 'main has-bottomnav' },
        e('div', { className: 'screen-header', style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
          e('h1', { className: 'screen-title display-font', style: { fontSize: 24 } }, 'On Shift'),
          e('button', { className: 'btn btn-ghost', style: { padding: '8px 14px', fontSize: 13 }, onClick: endShift }, 'End Shift')
        ),

        // Random event card
        event ? e('div', { className: 'event-card', style: { marginBottom: 14 } },
          e('div', { className: 'event-title' }, '⚡ ' + event.title),
          e('div', { style: { fontSize: 14, color: 'var(--text-dim)', marginBottom: 12 } }, event.desc),
          event.options
            ? e('div', { style: { display: 'flex', gap: 8 } },
                event.options.map((opt, i) =>
                  e('button', {
                    key: i,
                    className: 'btn ' + (i === 0 ? 'btn-primary' : 'btn-ghost'),
                    style: { flex: 1 },
                    onClick: () => resolveEvent(opt)
                  }, opt.label)
                )
              )
            : e('button', {
                className: 'btn btn-primary',
                style: { width: '100%' },
                onClick: () => resolveEvent(null)
              }, 'OK')
        ) : null,

        // The food truck stage
        order && orderSummary ? e('div', { className: 'ft-stage' },
          // Customer + receipt ticket row
          e('div', { className: 'customer-row' },
            e('div', { className: 'customer-card' + (timeLeft / maxTime < 0.3 ? ' impatient' : '') },
              e('div', { className: 'face' }, customerFace),
              e('div', { className: 'patience-bar' },
                e('div', { className: 'patience-bar-fill', style: { width: (timeLeft / maxTime * 100) + '%' } })
              )
            ),
            e('div', { className: 'order-receipt' },
              e('div', { className: 'receipt-header' }, "★ RAY'S ★ ORDER ★"),
              e('div', { className: 'receipt-items' },
                orderSummary.lines.map((l, i) =>
                  e('div', { className: 'item-line', key: i },
                    e('span', null,
                      e('span', { className: 'item-emoji' }, l.emoji), ' × ', l.count, ' ', l.name
                    ),
                    e('span', null, '$' + l.subtotal)
                  )
                )
              ),
              e('div', { className: 'receipt-total' },

      const fbReady = HustleFire.ready();
      const isCapacitor = HustleFire.isCapacitor();

      const openAuthModal = (mode) => {
        // mode = 'signin' or 'signup'
        setAuthModalMode(mode);
        setAuthModalView('picker');
        setEmailFormMode(mode === 'signup' ? 'signup' : 'signin');

        if (!email || !password) { toast && toast('Email and password required.', 'bad'); return; }

          await HustleFire.signInEmail(email, password);
          toast && toast('Signed in.', 'good');

    // ============================================================
    // Friends — Coming Soon (foundation laid in data layer)
    // ============================================================
    function FriendsScreen({ state, currentUser, onGoTo, pendingFriendCode, clearPendingFriendCode, toast, unlockAchievement }) {
      const [friends, setFriends] = useState([]);
      const [loading, setLoading] = useState(false);
      const [codeInput, setCodeInput] = useState('');
      const [adding, setAdding] = useState(false);
      const [showQR, setShowQR] = useState(false);

      const myCode = state.account.friendCode;
      const qrSvg = (myCode && HustleFire.ready()) ? HustleFire.generateQRSvg(myCode) : '';
      const inviteLink = (typeof window !== 'undefined') ?
        (window.location.origin + window.location.pathname + '?friend=' + encodeURIComponent(myCode)) : '';

      const refreshFriends = async () => {
        if (!currentUser) return;
        setLoading(true);
        try {
          const list = await HustleFire.listFriends(currentUser.uid);
          setFriends(list);
        } catch (e) { /* ignore */ }
        setLoading(false);
      };

      useEffect(() => {
        if (currentUser) refreshFriends();
        else setFriends([]);
      }, [currentUser ? currentUser.uid : null]);

      const handleAddFriend = async (rawCode) => {
        const code = (rawCode || '').trim().toUpperCase();
        if (!code) { toast && toast('Enter a friend code.', 'bad'); return; }
        if (code === myCode) { toast && toast("That's your own code.", 'bad'); return; }
        if (!currentUser) { toast && toast('Sign in to add friends.', 'bad'); return; }

        setAdding(true);
        try {
          const found = await HustleFire.findUserByCode(code);
          if (!found) {
            toast && toast('Code not found.', 'bad');
            setAdding(false);
            return;
          }
          await HustleFire.addFriend(currentUser.uid, found.uid, code, found.displayName || 'Marcus');
          toast && toast('Friend added!', 'good');
          if (unlockAchievement) unlockAchievement('made_a_friend');
          setCodeInput('');
          refreshFriends();
        } catch (e) {
          toast && toast(e.message || 'Could not add friend.', 'bad');
        }
        setAdding(false);
      };

      // If we landed via invite link, surface the prompt once signed in
      useEffect(() => {
        if (pendingFriendCode && currentUser) {
          handleAddFriend(pendingFriendCode);
          clearPendingFriendCode && clearPendingFriendCode();
        }
      }, [pendingFriendCode, currentUser ? currentUser.uid : null]);

      const handleRemove = async (friendUid) => {
        if (!currentUser) return;
        if (!confirm('Remove this friend?')) return;
        try {
          await HustleFire.removeFriend(currentUser.uid, friendUid);
          toast && toast('Friend removed.', 'amber');
          refreshFriends();
        } catch (e) {
          toast && toast('Could not remove.', 'bad');
        }
      };

      const copyCode = () => {
        if (navigator.clipboard) navigator.clipboard.writeText(myCode);
        toast && toast('Code copied.', 'good');
      };
      const copyLink = () => {
        if (navigator.clipboard) navigator.clipboard.writeText(inviteLink);
        toast && toast('Invite link copied.', 'good');
      };

      // ---- Render: signed-out gate ----
      if (!currentUser) {
        return e('div', { className: 'main has-bottomnav' },
          e('div', { className: 'screen-header' },
            e('h1', { className: 'screen-title display-font' }, 'Friends'),
            e('p', { className: 'screen-subtitle' }, 'Build your crew.')
          ),
          e('div', { className: 'side-menu-frame' },
            e('div', { className: 'smf-title' }, "RAY'S CREW"),
            e('div', { className: 'coming-soon', style: { padding: '32px 16px' } },
              e('div', { className: 'cs-emoji' }, '🔒'),
              e('h2', { className: 'cs-title display-font' }, 'Sign In to Continue'),
              e('p', { style: { maxWidth: 320, lineHeight: 1.5, color: '#d4c5a0' } },
                "Friends sync across devices via your account. Sign in or create one in Settings to add your crew."
              ),
              e('button', {
                className: 'btn btn-primary',
                style: { marginTop: 14 },
                onClick: () => onGoTo && onGoTo('settings')
              }, 'Open Settings')
            )
          )
        );

    // ============================================================
    // COIN FLIP — pick heads or tails, 2x payout on win
    // ============================================================
    function CoinFlipGame({ state, addStacks, toast, unlockAchievement, onBack }) {
      const stacks = Math.floor(state.stacks || 0);
      const [bet, setBet] = useState(10);
      const [side, setSide] = useState('H');
      const [flipping, setFlipping] = useState(false);
      const [result, setResult] = useState(null); // { won, side, payout }

      const play = () => {
        if (flipping) return;
        if (stacks < bet) { toast && toast('Not enough Stacks.', 'bad'); return; }
        addStacks(-bet);
        setFlipping(true);
        setResult(null);
        AudioFX.coinDrop(!!state.settings.sound);
        if (unlockAchievement) unlockAchievement('br_first_play');
        setTimeout(() => {
          const landed = Math.random() < 0.5 ? 'H' : 'T';
          const won = landed === side;
          const payout = won ? bet * 2 : 0;
          if (won) {
            addStacks(payout);
            AudioFX.bellDing(!!state.settings.sound);
            if (unlockAchievement) {
              unlockAchievement('br_first_win');
              if (payout >= 1000) unlockAchievement('br_big_win');
            }
          } else if (unlockAchievement && (stacks - bet) <= 0) {
            unlockAchievement('br_broke');
          }
          setResult({ won, side: landed, payout });
          setFlipping(false);
        }, 1600);
      };

      return e('div', { className: 'main has-bottomnav' },
        brHeader(onBack, 'Coin Flip', 'Pick a side. 50/50. Double or nothing.'),
        e('div', { className: 'br-game-screen' },
          brBalanceBar(stacks, bet),
          e('div', { className: 'br-flip-stage' },
            e('div', {
              className: 'br-flip-coin' + (flipping ? ' flipping' : ''),
              key: flipping ? 'flip-' + Date.now() : 'static'
            }, result && !flipping ? (result.side === 'H' ? 'H' : 'T') : '$')
          ),
          result && !flipping
            ? e('div', { className: 'br-result ' + (result.won ? 'win' : 'lose') },
                e('div', { className: 'br-result-label' }, result.won ? 'YOU WIN' : 'YOU LOSE'),
                e('div', { className: 'br-result-amount' },
                  result.won ? '+' + fmtStacks(result.payout) + ' Stacks' : 'Landed on ' + (result.side === 'H' ? 'Heads' : 'Tails')
                )
              )
            : null,
          e('div', { className: 'br-side-choice' },
            e('button', {
              className: side === 'H' ? 'active' : '',
              onClick: () => setSide('H'),
              disabled: flipping
            }, 'HEADS'),
            e('button', {
              className: side === 'T' ? 'active' : '',
              onClick: () => setSide('T'),
              disabled: flipping
            }, 'TAILS')
          ),
          brBetControls(bet, setBet, stacks),
          e('button', {
            className: 'br-action-btn',
            onClick: play,
            disabled: flipping || stacks < bet
          }, flipping ? 'Flipping...' : 'FLIP COIN')
        )
      );
    }

    // ============================================================
    // SLOT MACHINE — 3 reels, matches pay out
    // 3 identical = jackpot (10x bet); 2 identical = 2x; otherwise lose
    // ============================================================
    const SLOT_SYMBOLS = ['🍒', '🍋', '🔔', '⭐', '💎', '7️⃣'];
    function SlotsGame({ state, addStacks, toast, unlockAchievement, onBack }) {
      const stacks = Math.floor(state.stacks || 0);
      const [bet, setBet] = useState(10);
      const [reels, setReels] = useState(['🍒', '🍋', '🔔']);
      const [spinning, setSpinning] = useState(false);
      const [result, setResult] = useState(null);

      const play = () => {
        if (spinning) return;
        if (stacks < bet) { toast && toast('Not enough Stacks.', 'bad'); return; }
        addStacks(-bet);
        setSpinning(true);
        setResult(null);
        AudioFX.coinDrop(!!state.settings.sound);
        if (unlockAchievement) unlockAchievement('br_first_play');
        // Cycle reels visually during spin
        const cycle = setInterval(() => {
          setReels([
            SLOT_SYMBOLS[Math.floor(Math.random() * SLOT_SYMBOLS.length)],
            SLOT_SYMBOLS[Math.floor(Math.random() * SLOT_SYMBOLS.length)],
            SLOT_SYMBOLS[Math.floor(Math.random() * SLOT_SYMBOLS.length)]
          ]);
        }, 80);
        setTimeout(() => {
          clearInterval(cycle);
          const final = [
            SLOT_SYMBOLS[Math.floor(Math.random() * SLOT_SYMBOLS.length)],
            SLOT_SYMBOLS[Math.floor(Math.random() * SLOT_SYMBOLS.length)],
            SLOT_SYMBOLS[Math.floor(Math.random() * SLOT_SYMBOLS.length)]
          ];
          setReels(final);
          let payout = 0;
          let label = 'No match';
          if (final[0] === final[1] && final[1] === final[2]) {
            payout = bet * 10;
            label = 'JACKPOT! Three in a row!';
            if (unlockAchievement) unlockAchievement('br_jackpot');
          } else if (final[0] === final[1] || final[1] === final[2] || final[0] === final[2]) {
            payout = bet * 2;
            label = 'Pair! 2x bet.';
          }
          if (payout > 0) {
            addStacks(payout);
            AudioFX.bellDing(!!state.settings.sound);
            if (unlockAchievement) {
              unlockAchievement('br_first_win');
              if (payout >= 1000) unlockAchievement('br_big_win');
            }
          } else if (unlockAchievement && (stacks - bet) <= 0) {
            unlockAchievement('br_broke');
          }
          setResult({ won: payout > 0, payout, label });
          setSpinning(false);
        }, 1800);
      };

      return e('div', { className: 'main has-bottomnav' },
        brHeader(onBack, 'Slots', 'Three in a row = jackpot. Two matching = 2x.'),
        e('div', { className: 'br-game-screen' },
          brBalanceBar(stacks, bet),
          e('div', { className: 'br-slots-cabinet' },
            e('div', { className: 'br-slot-reels' },
              reels.map((sym, i) =>
                e('div', {
                  key: i,
                  className: 'br-slot-reel' + (spinning ? ' spinning' : '')
                }, sym)
              )
            )
          ),
          result && !spinning
            ? e('div', { className: 'br-result ' + (result.won ? 'win' : 'lose') },
                e('div', { className: 'br-result-label' }, result.won ? 'YOU WIN' : 'YOU LOSE'),
                e('div', { className: 'br-result-amount' },
                  result.won ? '+' + fmtStacks(result.payout) + ' Stacks' : result.label
                )
              )
            : null,
          brBetControls(bet, setBet, stacks),
          e('button', {
            className: 'br-action-btn',
            onClick: play,
            disabled: spinning || stacks < bet
          }, spinning ? 'Spinning...' : 'SPIN')
        )
      );
    }

    // ============================================================
    // SCRATCH CARD — 3x3 grid, tap to reveal. 3 matching icons = win
    // Win payout based on the matching icon's value tier
    // ============================================================
    const SCRATCH_ICONS = [
      { emoji: '💎', mult: 10, weight: 1 },   // rare jackpot
      { emoji: '⭐', mult: 5,  weight: 2 },
      { emoji: '🔔', mult: 3,  weight: 3 },
      { emoji: '🍒', mult: 2,  weight: 4 },
      { emoji: '🍋', mult: 1.5, weight: 4 },
      { emoji: '🥮', mult: 0,  weight: 6 }    // common, no win
    ];
    function pickScratchIcon() {
      const totalWeight = SCRATCH_ICONS.reduce((s, i) => s + i.weight, 0);
      let r = Math.random() * totalWeight;
      for (const ic of SCRATCH_ICONS) {
        r -= ic.weight;
        if (r <= 0) return ic;
      }
      return SCRATCH_ICONS[SCRATCH_ICONS.length - 1];
    }
    function ScratchGame({ state, addStacks, toast, unlockAchievement, onBack }) {
      const stacks = Math.floor(state.stacks || 0);
      const [bet, setBet] = useState(10);
      const [card, setCard] = useState(null); // array of 9 icon objects
      const [revealed, setRevealed] = useState([]); // array of 9 booleans
      const [result, setResult] = useState(null);

      const buy = () => {
        if (stacks < bet) { toast && toast('Not enough Stacks.', 'bad'); return; }
        addStacks(-bet);
        const newCard = [];
        for (let i = 0; i < 9; i++) newCard.push(pickScratchIcon());
        setCard(newCard);
        setRevealed([false, false, false, false, false, false, false, false, false]);
        setResult(null);
        AudioFX.coinDrop(!!state.settings.sound);
        if (unlockAchievement) unlockAchievement('br_first_play');
      };

      const reveal = (i) => {
        if (!card || revealed[i]) return;
        const newRevealed = revealed.slice();
        newRevealed[i] = true;
        setRevealed(newRevealed);
        // When all revealed, compute result
        if (newRevealed.every(v => v)) {
          // Count matches — find any icon appearing 3+ times
          const counts = {};
          card.forEach(ic => { counts[ic.emoji] = (counts[ic.emoji] || 0) + 1; });
          let bestPayout = 0;
          let bestLabel = 'No matches';
          Object.keys(counts).forEach(emoji => {
            if (counts[emoji] >= 3) {
              const ic = card.find(c => c.emoji === emoji);
              const payout = Math.floor(bet * ic.mult);
              if (payout > bestPayout) {
                bestPayout = payout;
                bestLabel = 'Three ' + emoji + '! ' + ic.mult + 'x bet';
              }
            }
          });
          if (bestPayout > 0) {
            addStacks(bestPayout);
            AudioFX.bellDing(!!state.settings.sound);
            if (unlockAchievement) {
              unlockAchievement('br_first_win');
              if (bestPayout >= 1000) unlockAchievement('br_big_win');
              if (bestLabel.indexOf('💎') >= 0) unlockAchievement('br_diamond');
            }
          } else if (unlockAchievement && stacks <= 0) {
            unlockAchievement('br_broke');
          }
          setResult({ won: bestPayout > 0, payout: bestPayout, label: bestLabel });
        }
      };

      return e('div', { className: 'main has-bottomnav' },
        brHeader(onBack, 'Scratch Card', 'Buy a card. Reveal all 9. 3 matching = win.'),
        e('div', { className: 'br-game-screen' },
          brBalanceBar(stacks, bet),
          card
            ? e('div', { className: 'br-scratch-grid' },
                card.map((ic, i) =>
                  e('div', {
                    key: i,
                    className: 'br-scratch-cell' + (revealed[i] ? ' revealed' : ''),
                    onClick: () => reveal(i)
                  },
                    revealed[i] ? e('span', { className: 'scratch-icon' }, ic.emoji) : null
                  )
                )
              )
            : e('div', { style: { textAlign: 'center', padding: 30, color: 'var(--text-faint)' } },
                'Pick a bet and buy a card to play.'
              ),
          result
            ? e('div', { className: 'br-result ' + (result.won ? 'win' : 'lose') },
                e('div', { className: 'br-result-label' }, result.won ? 'WINNER' : 'NO LUCK'),
                e('div', { className: 'br-result-amount' },
                  result.won ? '+' + fmtStacks(result.payout) + ' Stacks' : result.label
                )
              )
            : null,
          brBetControls(bet, setBet, stacks),
          e('button', {
            className: 'br-action-btn',
            onClick: buy,
            disabled: stacks < bet
          }, card && !result ? 'Reveal all 9 squares' : 'BUY CARD')
        )
      );
    }

    // ============================================================
    // DICE — over/under 7 (sum of 2 dice)
    // Pick over, under, or exactly 7. Over/under pays 2x, exactly-7 pays 5x
    // ============================================================
    function DiceGame({ state, addStacks, toast, unlockAchievement, onBack }) {
      const stacks = Math.floor(state.stacks || 0);
      const [bet, setBet] = useState(10);
      const [choice, setChoice] = useState('under'); // 'under' | 'seven' | 'over'
      const [rolling, setRolling] = useState(false);
      const [dice, setDice] = useState([3, 4]);
      const [result, setResult] = useState(null);

      const play = () => {
        if (rolling) return;
        if (stacks < bet) { toast && toast('Not enough Stacks.', 'bad'); return; }
        addStacks(-bet);
        setRolling(true);
        setResult(null);
        AudioFX.coinDrop(!!state.settings.sound);
        if (unlockAchievement) unlockAchievement('br_first_play');
        // Roll animation: cycle dice values
        const cycle = setInterval(() => {
          setDice([1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)]);
        }, 80);
        setTimeout(() => {
          clearInterval(cycle);
          const d1 = 1 + Math.floor(Math.random() * 6);
          const d2 = 1 + Math.floor(Math.random() * 6);
          const sum = d1 + d2;
          setDice([d1, d2]);
          let won = false;
          let payout = 0;
          if (choice === 'under' && sum < 7) { won = true; payout = bet * 2; }
          else if (choice === 'over' && sum > 7) { won = true; payout = bet * 2; }
          else if (choice === 'seven' && sum === 7) {
            won = true;
            payout = bet * 5;
            if (unlockAchievement) unlockAchievement('br_lucky_seven');
          }
          if (won) {
            addStacks(payout);
            AudioFX.bellDing(!!state.settings.sound);
            if (unlockAchievement) {
              unlockAchievement('br_first_win');
              if (payout >= 1000) unlockAchievement('br_big_win');
            }
          } else if (unlockAchievement && (stacks - bet) <= 0) {
            unlockAchievement('br_broke');
          }
          setResult({ won, payout, sum });
          setRolling(false);
        }, 900);
      };

      return e('div', { className: 'main has-bottomnav' },
        brHeader(onBack, 'Dice', 'Two dice. Bet on the sum. Over/under pays 2x. Lucky 7 pays 5x.'),
        e('div', { className: 'br-game-screen' },
          brBalanceBar(stacks, bet),
          e('div', { className: 'br-dice-stage' },
            e('div', { className: 'br-dice-big' + (rolling ? ' rolling' : '') }, dice[0]),

    // ============================================================
    // Achievements — foundation only
    // ============================================================
    function AchievementsScreen({ onBack, state }) {
      const unlockedList = Array.isArray(state.unlockedAchievements) ? state.unlockedAchievements : [];
      const unlockedSet = new Set(unlockedList);
      const total = ACHIEVEMENTS.length;
      const earned = unlockedList.filter(id => ACHIEVEMENTS.some(a => a.id === id)).length;
      const pct = total > 0 ? Math.round((earned / total) * 100) : 0;

      // Group by category, preserve order from ACHIEVEMENTS array
      const byCategory = {};
      const categoryOrder = [];
      for (let i = 0; i < ACHIEVEMENTS.length; i++) {
        const a = ACHIEVEMENTS[i];
        if (!byCategory[a.cat]) {
          byCategory[a.cat] = [];
          categoryOrder.push(a.cat);
        }
        byCategory[a.cat].push(a);
      }

      return e('div', { className: 'main has-bottomnav' },
        e('div', { className: 'screen-header' },
          onBack ? e('button', { className: 'back-btn', onClick: onBack },
            e('span', { className: 'arrow' }, '‹'), 'Back'
          ) : null,
          e('h1', { className: 'screen-title display-font' }, 'Achievements'),
          e('p', { className: 'screen-subtitle' }, 'Milestones and discoveries.')
        ),
        e('div', { className: 'side-menu-frame' },
          e('div', { className: 'smf-title' }, 'TROPHY CASE'),

          // Progress header
          e('div', { className: 'ach-progress' },
            e('div', { className: 'ach-progress-top' },
              e('span', { className: 'ach-progress-label' }, 'Unlocked'),
              e('span', { className: 'ach-progress-count' }, earned + ' / ' + total)
            ),
            e('div', { className: 'ach-progress-bar' },
              e('div', { style: { width: pct + '%' } })
            )
          ),

          // Categories
          categoryOrder.map(catName => {
            const items = byCategory[catName];
            const earnedInCat = items.filter(a => unlockedSet.has(a.id)).length;
            return e('div', { key: catName },
              e('div', { className: 'ach-category-title' },
                catName + ' (' + earnedInCat + '/' + items.length + ')'
              ),
              e('div', { className: 'ach-list' },
                items.map(a => {
                  const unlocked = unlockedSet.has(a.id);
                  const hideForSecret = a.secret && !unlocked;
                  return e('div', {
                    key: a.id,
                    className: 'ach-card ' + (unlocked ? 'unlocked' : 'locked')
                  },
                    e('div', { className: 'ach-icon' }, hideForSecret ? '❓' : a.icon),
                    e('div', { className: 'ach-text' },
                      e('div', { className: 'ach-title' }, hideForSecret ? '???' : a.title),
                      e('div', { className: 'ach-desc' }, hideForSecret ? 'Keep playing to discover this one.' : a.desc)
                    ),
                    e('div', { className: 'ach-status' }, unlocked ? '✓' : '—')
                  );
                })
              )
            );
          })
        )
      );
    }

        // ---- Trophies (count summary, link to full screen) ----
